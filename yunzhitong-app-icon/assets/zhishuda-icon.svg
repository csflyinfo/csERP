<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%" fx="50%" fy="35%">
      <stop offset="0%" stop-color="#E8F7FF"/>
      <stop offset="45%" stop-color="#74C0FC"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36CFC9"/>
      <stop offset="100%" stop-color="#13C2C2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgGrad)"/>
  <ellipse cx="512" cy="260" rx="360" ry="160" fill="white" opacity="0.18"/>

  <g transform="translate(0, 40)">
    <path d="M 220 560 Q 512 660 820 540"
          fill="none"
          stroke="url(#roadGrad)"
          stroke-width="42"
          stroke-linecap="round"/>
    <path d="M 760 500 L 830 540 L 760 580 L 780 540 Z" fill="#13C2C2"/>
    <path d="M 782 518 L 840 540 L 782 562 Z" fill="#13C2C2"/>
  </g>

  <g transform="translate(512, 420)" filter="url(#dropShadow)">
    <rect x="-235" y="-110" width="310" height="190" rx="28" fill="white"/>
    <path d="M 85 -110 L 170 -110 Q 210 -110 210 -70 L 210 40 L 85 40 Z" fill="white"/>
    <path d="M 100 -95 L 170 -95 Q 190 -95 190 -75 L 190 -35 L 100 -35 Z" fill="#BAE7FF"/>
    <rect x="105" y="-25" width="30" height="6" rx="3" fill="#E6F7FF"/>
    <circle cx="-155" cy="95" r="38" fill="#1D2129"/>
    <circle cx="-155" cy="95" r="18" fill="white"/>
    <circle cx="145" cy="95" r="38" fill="#1D2129"/>
    <circle cx="145" cy="95" r="18" fill="white"/>
    <rect x="-200" y="65" width="380" height="18" rx="9" fill="#1677FF"/>
    <rect x="198" y="0" width="10" height="22" rx="4" fill="#FFD666"/>
  </g>

  <text x="512" y="790"
        text-anchor="middle"
        font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
        font-size="130"
        font-weight="700"
        fill="white"
        letter-spacing="12">
    智速达
  </text>

  <text x="512" y="890"
        text-anchor="middle"
        font-family="'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="34"
        font-weight="500"
        fill="white"
        opacity="0.85"
        letter-spacing="6">
    智慧配送
  </text>
</svg>
