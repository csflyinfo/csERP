server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: erp-wms-tms-backend
  datasource:
    url: jdbc:h2:file:./data/erp-v1;MODE=MySQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    demo-token: demo-token
