server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: erp-wms-tms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 全局 Jackson：日期时间输出为 'yyyy-MM-dd HH:mm:ss'（LocalDate 单独用 @JsonFormat 覆盖为 'yyyy-MM-dd'）
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: "Asia/Shanghai"
    serialization:
      write-dates-as-timestamps: false
  # 文件上传配置（图片 multipart 上传）
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/erp-v1;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;TRACE_LEVEL_FILE=0
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # 迁移用 Flyway；不再用 spring.sql.init.always 每次启动重跑 schema/data
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # 老库（在 Flyway 之前已经存在）跑到最新版本；新库直接跑所有 V*.sql
    baseline-version: 0
  sql:
    init:
      # 显式关闭旧初始化机制，避免和 Flyway 冲突
      mode: never
  redis:
    host: localhost
    port: 6379
    password: erp_redis_2024
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  mybatis-plus:
    mapper-locations: classpath:/mapper/**/*.xml
    type-aliases-package: com.erp
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

logging:
  level:
    com.erp: debug

# 存储配置（开发环境：本地文件系统）
storage:
  type: local
  local:
    base-dir: ./data/uploads
    url-prefix: /api/uploads

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/erp_v1?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:erp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:erp_pass_2024}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
  sql:
    init:
      mode: never
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:erp_redis_2024}
    database: 0
    lettuce:
      pool:
        max-active: 16
        max-idle: 16
        min-idle: 4
  mybatis-plus:
    mapper-locations: classpath:/mapper/**/*.xml
    type-aliases-package: com.erp
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

logging:
  level:
    root: warn
    com.erp: info
  file:
    name: /app/logs/app.log
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 存储配置（生产环境：MinIO 对象存储）
storage:
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:erp_minio}
    secret-key: ${MINIO_SECRET_KEY:erp_minio_secret}
    bucket: ${MINIO_BUCKET:tms-images}
    url-prefix: ${MINIO_URL_PREFIX:http://minio:9000/tms-images}

---
# JWT 配置
jwt:
  secret: ${JWT_SECRET:erp_jwt_secret_key_2024_change_in_production}
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: Bearer