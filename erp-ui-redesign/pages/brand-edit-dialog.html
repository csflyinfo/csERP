<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增品牌 - 商贸云 ERP</title>
    <style id="theme-vars">
:root {
  /* === Brand Colors - Tech Blue === */
  --brand-primary: #1677FF;
  --brand-primary-light: #4096FF;
  --brand-primary-dark: #0958D9;
  --brand-primary-50: #E6F4FF;
  --brand-primary-100: #BAE0FF;
  --brand-primary-200: #91CAFF;
  --brand-primary-600: #1677FF;
  --brand-primary-700: #0958D9;
  --brand-primary-800: #003EB3;
  --brand-primary-900: #002C8C;

  /* === Semantic Colors === */
  --state-success: #52C41A;
  --state-success-light: #B7EB8F;
  --state-success-bg: #F6FFED;
  --state-warning: #FAAD14;
  --state-warning-light: #FFF1B8;
  --state-warning-bg: #FFFBE6;
  --state-error: #FF4D4F;
  --state-error-light: #FFCCC7;
  --state-error-bg: #FFF2F0;
  --state-info: #1677FF;
  --state-info-light: #91CAFF;
  --state-info-bg: #E6F4FF;

  /* === Surface Colors === */
  --surface-bg: #F5F7FA;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-sidebar: #D6E4FF;
  --surface-sidebar-hover: #E6F4FF;
  --surface-sidebar-active: #1677FF;
  --surface-header: #FFFFFF;
  --surface-input: #FFFFFF;

  /* === Text Colors === */
  --text-primary: #141414;
  --text-secondary: #595959;
  --text-tertiary: #8C8C8C;
  --text-inverse: #FFFFFF;
  --text-sidebar: #1D2129;
  --text-sidebar-active: #FFFFFF;
  --text-link: #1677FF;

  /* === Border Colors === */
  --border-default: #E8E8E8;
  --border-light: #F0F0F0;
  --border-focus: #1677FF;
  --border-sidebar: #D6E4FF;

  /* === Spacing Scale === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Typography === */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --font-size-4xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* === Border Radius === */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.05);
  --shadow-xl: 0 20px 25px rgba(0,0,0,0.06);
  --shadow-overlay: 0 25px 50px rgba(0,0,0,0.12);

  /* === Layout Tokens === */
  --sidebar-width: 160px;
  --sidebar-collapsed-width: 40px;
  --header-height: 48px;
  --tab-height: 36px;
  --table-header-height: 32px;
  --table-row-height: 32px;
  --toolbar-height: 40px;
}

/* === Typography Classes === */
.font-display { font-family: var(--font-family); font-weight: var(--font-weight-bold); }
.font-body { font-family: var(--font-family); font-weight: var(--font-weight-normal); }
.font-mono { font-family: var(--font-mono); }
.text-xs { font-size: var(--font-size-xs); }
.text-sm { font-size: var(--font-size-sm); }
.text-base { font-size: var(--font-size-base); }
.text-md { font-size: var(--font-size-md); }
.text-lg { font-size: var(--font-size-lg); }
.text-xl { font-size: var(--font-size-xl); }
.text-2xl { font-size: var(--font-size-2xl); }
.text-3xl { font-size: var(--font-size-3xl); }
.text-4xl { font-size: var(--font-size-4xl); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--brand-primary);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
    <div class="dialog-backdrop" id="drawer-backdrop">
        <div class="dialog" onclick="event.stopPropagation()">
            <!-- Header -->
            <div class="dialog-header">
                <div class="dialog-title">新增品牌</div>
                <button class="dialog-close" data-dom-id="btn-close" title="关闭">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- Body -->
            <div class="dialog-body">
                <div class="form-item">
                    <label class="form-label required">品牌编号：</label>
                    <div class="form-control">
                        <input type="text" class="form-input" placeholder="请输入产品编号">
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label required">品牌名称：</label>
                    <div class="form-control">
                        <input type="text" class="form-input" placeholder="请输入产品名称">
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label required">是否停用：</label>
                    <div class="form-control">
                        <select class="form-select">
                            <option selected>启用</option>
                            <option>停用</option>
                        </select>
                    </div>
                </div>
                <div class="form-item form-item-textarea">
                    <label class="form-label">备注：</label>
                    <div class="form-control">
                        <textarea class="form-textarea" placeholder="请输入备注"></textarea>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="dialog-footer">
                <button class="btn btn-outline" data-dom-id="btn-cancel">取消</button>
                <button class="btn btn-primary" data-dom-id="btn-confirm">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
