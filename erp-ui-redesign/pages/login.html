<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 商贸云 ERP</title>
    <style id="theme-vars">
:root {
  /* === Brand Colors - Tech Blue === */
  --brand-primary: #1677FF;
  --brand-primary-light: #4096FF;
  --brand-primary-dark: #0958D9;
  --brand-primary-50: #E6F4FF;
  --brand-primary-100: #BAE0FF;
  --brand-primary-200: #91CAFF;
  --brand-primary-600: #1677FF;
  --brand-primary-700: #0958D9;
  --brand-primary-800: #003EB3;
  --brand-primary-900: #002C8C;

  /* === Semantic Colors === */
  --state-success: #52C41A;
  --state-success-light: #B7EB8F;
  --state-success-bg: #F6FFED;
  --state-warning: #FAAD14;
  --state-warning-light: #FFF1B8;
  --state-warning-bg: #FFFBE6;
  --state-error: #FF4D4F;
  --state-error-light: #FFCCC7;
  --state-error-bg: #FFF2F0;
  --state-info: #1677FF;
  --state-info-light: #91CAFF;
  --state-info-bg: #E6F4FF;

  /* === Surface Colors === */
  --surface-bg: #F5F7FA;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-sidebar: #D6E4FF;
  --surface-sidebar-hover: #E6F4FF;
  --surface-sidebar-active: #1677FF;
  --surface-header: #FFFFFF;
  --surface-input: #FFFFFF;

  /* === Text Colors === */
  --text-primary: #141414;
  --text-secondary: #595959;
  --text-tertiary: #8C8C8C;
  --text-inverse: #FFFFFF;
  --text-sidebar: #1D2129;
  --text-sidebar-active: #FFFFFF;
  --text-link: #1677FF;

  /* === Border Colors === */
  --border-default: #E8E8E8;
  --border-light: #F0F0F0;
  --border-focus: #1677FF;
  --border-sidebar: #D6E4FF;

  /* === Spacing Scale === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Typography === */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --font-size-4xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* === Border Radius === */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.05);
  --shadow-xl: 0 20px 25px rgba(0,0,0,0.06);
  --shadow-overlay: 0 25px 50px rgba(0,0,0,0.12);

  /* === Layout Tokens === */
  --sidebar-width: 160px;
  --sidebar-collapsed-width: 40px;
  --header-height: 48px;
  --tab-height: 36px;
  --table-header-height: 32px;
  --table-row-height: 32px;
  --toolbar-height: 40px;
}

/* === Typography Classes === */
.font-display { font-family: var(--font-family); font-weight: var(--font-weight-bold); }
.font-body { font-family: var(--font-family); font-weight: var(--font-weight-normal); }
.font-mono { font-family: var(--font-mono); }
.text-xs { font-size: var(--font-size-xs); }
.text-sm { font-size: var(--font-size-sm); }
.text-base { font-size: var(--font-size-base); }
.text-md { font-size: var(--font-size-md); }
.text-lg { font-size: var(--font-size-lg); }
.text-xl { font-size: var(--font-size-xl); }
.text-2xl { font-size: var(--font-size-2xl); }
.text-3xl { font-size: var(--font-size-3xl); }
.text-4xl { font-size: var(--font-size-4xl); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--brand-primary);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-body" style="font-family: 'Inter', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; background: #F7FAFC;">

  <!-- Full-height split layout -->
  <div class="flex min-h-screen">

    <!-- Left Panel: Brand Showcase (60%) -->
    <div class="brand-panel hidden lg:flex lg:w-[60%] flex-col items-center justify-center relative">

      <!-- Floating decorative shapes -->
      <div class="floating-shape bg-white" style="width:200px;height:200px;top:10%;left:5%;animation-delay:0s;"></div>
      <div class="floating-shape bg-white" style="width:120px;height:120px;top:60%;right:10%;animation-delay:2s;"></div>
      <div class="floating-shape bg-white" style="width:80px;height:80px;bottom:15%;left:25%;animation-delay:4s;"></div>
      <div class="floating-shape bg-white" style="width:160px;height:160px;top:20%;right:25%;animation-delay:1s;"></div>

      <!-- Brand content -->
      <div class="relative z-10 text-center px-12">
        <!-- Brand Mark -->
        <div class="brand-mark mx-auto mb-10">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 22L16 14L22 20L36 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M28 6H36V14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="22" cy="30" r="8" stroke="white" stroke-width="2.5" fill="none"/>
            <path d="M19 30L21 32L25 28" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <!-- Product Name -->
        <h1 class="text-white font-bold tracking-wide" style="font-size: 36px; letter-spacing: 0.05em; line-height: 1.25;">
          商贸云 ERP
        </h1>
        <p class="mt-3 font-semibold" style="font-size: 18px; color: rgba(255,255,255,0.8); letter-spacing: 0.1em;">
          V1.0
        </p>

        <!-- Tagline -->
        <p class="mt-6 font-medium" style="font-size: 16px; color: rgba(255,255,255,0.6); letter-spacing: 0.15em;">
          经销商智能经营平台
        </p>

        <!-- Feature highlights -->
        <div class="mt-16 flex gap-12 justify-center">
          <div class="text-center">
            <div class="w-12 h-12 rounded-lg mx-auto mb-3 flex items-center justify-center" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M9 21V9"/>
              </svg>
            </div>
            <p class="text-white text-sm font-medium opacity-70">进销存管理</p>
          </div>
          <div class="text-center">
            <div class="w-12 h-12 rounded-lg mx-auto mb-3 flex items-center justify-center" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
              </svg>
            </div>
            <p class="text-white text-sm font-medium opacity-70">仓储物流</p>
          </div>
          <div class="text-center">
            <div class="w-12 h-12 rounded-lg mx-auto mb-3 flex items-center justify-center" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/>
              </svg>
            </div>
            <p class="text-white text-sm font-medium opacity-70">数据分析</p>
          </div>
        </div>
      </div>

      <!-- Bottom copyright on left panel -->
      <div class="absolute bottom-8 left-0 right-0 text-center z-10">
        <p style="font-size: 12px; color: rgba(255,255,255,0.35);">
          Copyright 2026 商贸云科技
        </p>
      </div>
    </div>

    <!-- Right Panel: Login Form (40%) -->
    <div class="w-full lg:w-[40%] flex flex-col items-center justify-center px-8 py-12" style="background: #FFFFFF;">

      <!-- Mobile-only brand header -->
      <div class="lg:hidden mb-8 text-center">
        <div class="brand-mark mx-auto mb-4" style="width:56px;height:56px;border-radius:14px;">
          <svg width="28" height="28" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 22L16 14L22 20L36 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M28 6H36V14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="22" cy="30" r="8" stroke="white" stroke-width="2.5" fill="none"/>
            <path d="M19 30L21 32L25 28" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="text-xl font-bold" style="color: #1A365D;">商贸云 ERP</h1>
      </div>

      <!-- Login Card -->
      <div class="login-card w-full max-w-md">
        <!-- Welcome text -->
        <div class="mb-8">
          <h2 class="text-2xl font-bold" style="color: var(--text-primary, #1A202C);">
            欢迎回来
          </h2>
          <p class="mt-2" style="font-size: var(--font-size-base, 14px); color: var(--text-secondary, #4A5568);">
            请登录您的账号以继续操作
          </p>
        </div>

        <!-- Login Form -->
        <form onsubmit="return false;" autocomplete="on">
          <!-- Account -->
          <div class="mb-5">
            <label class="block mb-2 font-medium" style="font-size: var(--font-size-sm, 13px); color: var(--text-primary, #1A202C);">
              账号
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <input
                type="text"
                id="input-account"
                class="login-input w-full rounded-lg py-2.5 pl-10 pr-4"
                style="font-size: var(--font-size-base, 14px); color: var(--text-primary, #1A202C); background: var(--surface-input, #FFFFFF);"
                placeholder="请输入账号"
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Password -->
          <div class="mb-5">
            <label class="block mb-2 font-medium" style="font-size: var(--font-size-sm, 13px); color: var(--text-primary, #1A202C);">
              密码
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
              </div>
              <input
                type="password"
                id="input-password"
                class="login-input w-full rounded-lg py-2.5 pl-10 pr-10"
                style="font-size: var(--font-size-base, 14px); color: var(--text-primary, #1A202C); background: var(--surface-input, #FFFFFF);"
                placeholder="请输入密码"
                autocomplete="current-password"
              >
              <!-- Toggle password visibility -->
              <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3.5 cursor-pointer" onclick="togglePassword()" aria-label="切换密码可见性">
                <svg id="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 01-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember me & Forgot -->
          <div class="flex items-center justify-between mb-6">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input
                type="checkbox"
                id="checkbox-remember"
                class="w-4 h-4 rounded"
                style="accent-color: #2B6CB0;"
              >
              <span style="font-size: var(--font-size-sm, 13px); color: var(--text-secondary, #4A5568);">
                记住我
              </span>
            </label>
            <a href="#" class="font-medium" style="font-size: var(--font-size-sm, 13px); color: var(--text-link, #2B6CB0);">
              忘记密码?
            </a>
          </div>

          <!-- Error hint -->
          <div id="login-error" class="mb-4 hidden">
            <div class="flex items-center gap-2 px-3 py-2 rounded-lg" style="background: var(--state-error-bg, #FFF5F5); border: 1px solid var(--state-error-light, #FED7D7);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--state-error, #E53E3E)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
              </svg>
              <span style="font-size: var(--font-size-sm, 13px); color: var(--state-error, #E53E3E);">
                账号或密码错误
              </span>
            </div>
          </div>

          <!-- Login Button -->
          <button
            type="submit"
            data-dom-id="btn-login"
            class="btn-login w-full py-2.5 rounded-lg text-white font-semibold cursor-pointer"
            style="font-size: var(--font-size-lg, 16px); background: var(--brand-primary, #2B6CB0); border: none; height: 44px;"
          >
            登 录
          </button>
        </form>

        <!-- Additional info -->
        <div class="mt-8 text-center">
          <p style="font-size: var(--font-size-xs, 12px); color: var(--text-tertiary, #A0AEC0);">
            还没有账号?
            <a href="#" class="font-medium" style="color: var(--text-link, #2B6CB0);"> 联系管理员开通</a>
          </p>
        </div>
      </div>

      <!-- Desktop footer -->
      <div class="hidden lg:block mt-12">
        <p style="font-size: 12px; color: var(--text-tertiary, #A0AEC0);">
          Copyright 2026 商贸云科技
        </p>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('input-password');
      const iconEye = document.getElementById('icon-eye');
      const iconEyeOff = document.getElementById('icon-eye-off');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        iconEye.classList.add('hidden');
        iconEyeOff.classList.remove('hidden');
      } else {
        passwordInput.type = 'password';
        iconEye.classList.remove('hidden');
        iconEyeOff.classList.add('hidden');
      }
    }

    // Show error on login attempt for demo
    document.querySelector('[data-dom-id="btn-login"]').addEventListener('click', function(e) {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      const account = document.getElementById('input-account').value.trim();
      const password = document.getElementById('input-password').value.trim();

      if (!account || !password) {
        errorEl.classList.remove('hidden');
        errorEl.querySelector('span').textContent = '请输入账号和密码';
      } else {
        errorEl.classList.remove('hidden');
        errorEl.querySelector('span').textContent = '账号或密码错误';
      }
    });
  </script>

    <style>
    /* Geometric pattern overlay for left panel */
    .brand-panel {
      background: linear-gradient(135deg, #1A365D 0%, #2B6CB0 100%);
      position: relative;
      overflow: hidden;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.06;
      background-image:
        linear-gradient(30deg, rgba(255,255,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,0.3) 87.5%),
        linear-gradient(150deg, rgba(255,255,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,0.3) 87.5%),
        linear-gradient(30deg, rgba(255,255,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,0.3) 87.5%),
        linear-gradient(150deg, rgba(255,255,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,0.3) 87.5%);
      background-size: 80px 140px;
      background-position: 0 0, 0 0, 40px 70px, 40px 70px;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 80%, rgba(49,130,206,0.15) 0%, transparent 50%);
    }

    /* Brand mark */
    .brand-mark {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2B6CB0 0%, #63B3ED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(43, 108, 176, 0.35);
    }

    /* Input focus transition */
    .login-input {
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid var(--border-default, #E2E8F0);
    }

    .login-input:focus {
      border-color: var(--border-focus, #3182CE);
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
      outline: none;
    }

    /* Login button */
    .btn-login {
      transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
    }

    .btn-login:hover {
      background-color: #2C5282;
      box-shadow: 0 4px 12px rgba(43, 108, 176, 0.35);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    /* Card entrance animation */
    @keyframes cardSlideIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      animation: cardSlideIn 0.5s ease-out;
    }

    /* Floating particles */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .floating-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.07;
      animation: float 6s ease-in-out infinite;
    }
  </style>
</body>
</html>
