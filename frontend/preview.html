<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商贸云 ERP V1.0 开发预览</title>
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><div class="mark"></div>商贸云 ERP V1.0</div>
    <button class="hamb">☰</button>
    <div class="nav-module"><div class="title" id="title">经营概览</div><div class="desc" id="desc">企业经销数据、排行与待办</div></div>
    <div class="spacer"></div>
    <div class="actions"><button class="btn" onclick="render(current)">返回列表</button><button class="btn primary" onclick="newRecord()">新建</button></div>
    <button class="topbtn">导出中心</button><button class="topbtn">消息</button><div class="user"><div class="avatar">管</div><span>管理员</span></div>
  </header>
  <aside class="side" id="side"></aside>
  <main class="main"><div class="content" id="content"></div></main>
</div>
<script>
const menus={首页:[['dashboard','经营概览']],基础资料:[['goods','商品档案'],['category','商品分类'],['unit','单位管理'],['brand','品牌管理'],['warehouse','仓库资料'],['customerPrice','客户价格调整单'],['customerPriceQuery','客户价格查询']],系统管理:[['user','用户管理'],['param','系统参数'],['billNo','单据编号规则'],['log','操作日志']]}
let activeTop='首页',current='dashboard'
function menu(){side.innerHTML='<div class="side-search"><input class="quick-search" placeholder="模块快捷搜索：客户、商品、供应商、单据号" onkeydown="if(event.key===\'Enter\')quick(this.value)"></div>'+Object.entries(menus).map(([g,items])=>`<div class="lvl1 ${activeTop===g?'on':''}" onclick="activeTop='${g}';render('${items[0][0]}')"><span class="dot"></span>${g}</div>${activeTop===g?`<div class="submenu">${items.map(i=>`<div class="lvl2 ${current===i[0]?'on':''}" onclick="render('${i[0]}')">${i[1]}</div>`).join('')}</div>`:''}`).join('')}
function nameOf(id){return Object.values(menus).flat().find(i=>i[0]===id)?.[1]||'经营概览'}
function quick(v){const hit=Object.values(menus).flat().find(i=>i[1].includes(v));hit?render(hit[0]):alert('未找到匹配模块')}
function render(id){current=id;Object.entries(menus).forEach(([g,items])=>{if(items.some(i=>i[0]===id))activeTop=g});menu();title.textContent=nameOf(id);desc.textContent=id==='customerPrice'?'客户价格调整单审核后生效，最新调价覆盖旧价':id==='customerPriceQuery'?'查询客户价格明细，可停用价格':'紧凑查询、列表管理、新建编辑、导入导出'; if(id==='dashboard') return dashboard(); if(id==='customerPrice') return priceAdjustList(); if(id==='customerPriceQuery') return priceQuery(); list(id)}
function dashboard(){content.innerHTML='<div class="cards">'+[['动销门店数','286'],['订单金额','¥82,450'],['库存金额','¥1.42M'],['待审核','15']].map(x=>`<div class="card"><div>${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')+'</div>'}
function filter(){return '<div class="filter"><div class="fi"><label>关键字</label><input placeholder="关键字"></div><div class="fi"><label>状态</label><select><option>全部状态</option></select></div><button class="btn primary">查询</button><button class="btn">重置</button></div>'}
function list(id){content.innerHTML=filter()+`<div class="tablebox"><div class="toolbar"><b>记录列表</b><div class="spacer"></div><button class="btn">字段设置</button><button class="btn">导出</button></div><div class="scroll"><table><tr><th>编码</th><th>名称</th><th>类型/分组</th><th>状态</th><th>操作</th></tr><tr><td>${id.toUpperCase()}001</td><td>${nameOf(id)}示例</td><td>默认</td><td><span class="badge ok">正常</span></td><td><span class="link" onclick="newRecord()">编辑</span></td></tr></table></div></div>`}
function priceAdjustList(){content.innerHTML=filter()+`<div style="text-align:right;margin-bottom:8px"><button class="btn primary" onclick="priceEdit()">新建调整单</button><button class="btn">批量导入生成调整单</button></div><div class="tablebox"><div class="toolbar"><b>客户价格调整单</b></div><div class="scroll"><table><tr><th>单号</th><th>客户</th><th>单据日期</th><th>生效方式</th><th>有效范围</th><th>制单信息</th><th>审核信息</th><th>状态</th></tr><tr ondblclick="priceEdit()"><td>CPA202606140001</td><td>C001 华联超市</td><td>2026-06-14</td><td>定时生效</td><td>2026-06-15 ~ 2026-12-31</td><td>管理员 10:20</td><td>待审核</td><td><span class="badge wait">待审核</span></td></tr></table></div></div>`}
function priceEdit(){title.textContent='新建 - 客户价格调整单';desc.textContent='先选客户与生效规则，再添加调价商品；审核后才确认';content.innerHTML=`<div class="form-card"><div class="form-head"><b>客户价格调整单</b><span class="badge wait" style="margin-left:10px">待审核</span></div><div class="form-body"><div class="section"><h3>调价信息</h3><div class="grid4"><div class="field"><label>客户 *</label><select><option>C001 华联超市</option></select></div><div class="field"><label>生效方式 *</label><select><option>立即生效</option><option selected>定时生效</option></select></div><div class="field"><label>生效时间点</label><input value="2026-06-15 08:00"></div><div class="field"><label>价格有效范围 *</label><select><option>长期有效</option><option selected>2026-06-15 ~ 2026-12-31</option></select></div></div></div><div class="section"><h3>调价商品明细</h3><div class="toolbar"><button class="btn primary">表格录入商品</button><button class="btn">从商品档案添加</button><button class="btn">导入商品</button></div><div class="scroll"><table><tr><th>商品编号</th><th>名称</th><th>基本单位</th><th>规格</th><th>条码</th><th>原价</th><th>现价</th><th>最新进价</th><th>成本价</th></tr><tr><td>SP001</td><td>农夫山泉500ml*24</td><td>瓶</td><td>500ml*24</td><td>6941410749551</td><td class="num">35.00</td><td contenteditable class="num">34.50</td><td class="num">31.20</td><td class="num">30.80</td></tr></table></div></div></div><div class="summary"><span>审核后生效，旧价自动停用</span><div class="spacer"></div><button class="btn primary">审核</button></div></div>`}
function priceQuery(){content.innerHTML=filter()+`<div style="text-align:right;margin-bottom:8px"><button class="btn danger">停用所选价格</button></div><div class="tablebox"><div class="toolbar"><b>客户价格明细</b></div><div class="scroll"><table><tr><th>单号</th><th>客户编号/名称</th><th>商品编号</th><th>名称</th><th>原价</th><th>现价</th><th>生效状态</th><th>操作</th></tr><tr><td>CPA202606140001</td><td>C001 华联超市</td><td>SP001</td><td>农夫山泉500ml*24</td><td class="num">35.00</td><td class="num">34.50</td><td><span class="badge ok">生效中</span></td><td><span class="link">停用</span></td></tr></table></div></div>`}
function newRecord(){current==='customerPrice'?priceEdit():alert('打开新建/编辑')}
render('dashboard')
</script>
</body>
</html>
