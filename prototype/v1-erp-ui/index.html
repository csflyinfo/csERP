<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V1.0 ERP核心经营版 UI交互原型</title>
  <style>
    :root{
      --primary:#2563eb;--primary-2:#1d4ed8;--bg:#f5f7fb;--panel:#fff;--line:#e2e8f0;--line-2:#cbd5e1;
      --text:#0f172a;--muted:#64748b;--soft:#94a3b8;--success:#16a34a;--warn:#f59e0b;--danger:#dc2626;--info:#0ea5e9;--purple:#7c3aed;
      --shadow:0 12px 34px rgba(15,23,42,.08);--radius:14px;--row:34px;--sidebar:232px;--top:56px;
      --mono:"Roboto Mono","Cascadia Mono",Consolas,monospace;--sans:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden}
    button,input,select,textarea{font:inherit} button{cursor:pointer} .app{height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--top) 1fr}
    .top{grid-column:1/3;height:var(--top);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:18px;z-index:4}
    .brand{display:flex;align-items:center;gap:10px;width:210px;font-weight:800;font-size:15px}.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#0ea5e9);box-shadow:0 8px 20px rgba(37,99,235,.28)}
    .crumb{font-weight:700;color:#334155}.global-search{height:34px;border:1px solid var(--line);border-radius:10px;padding:0 12px;width:320px;background:#f8fafc}.top-spacer{flex:1}.icon-btn{height:32px;min-width:32px;border:1px solid var(--line);background:#fff;border-radius:9px;color:#334155}.user{display:flex;align-items:center;gap:8px}.avatar{width:28px;height:28px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}
    .side{grid-row:2;background:#0f172a;color:#cbd5e1;overflow:auto;padding:12px 10px}.nav-title{font-size:11px;color:#64748b;margin:14px 10px 8px}.nav-item{height:36px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:10px;margin:3px 0;color:#cbd5e1;cursor:pointer}.nav-item:hover{background:#1e293b}.nav-item.active{background:#2563eb;color:#fff;box-shadow:0 10px 22px rgba(37,99,235,.25)}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.85}
    .main{grid-row:2;overflow:auto;padding:16px}.page{display:none;animation:fade .18s ease}.page.active{display:block}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
    .page-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}.page-title{font-size:22px;font-weight:850;letter-spacing:-.02em}.page-desc{color:var(--muted)}.head-actions{margin-left:auto;display:flex;gap:8px}
    .btn{height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 12px;color:#334155}.btn:hover{border-color:#93c5fd;color:#1d4ed8}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{background:#fff;border-color:#fecaca;color:#dc2626}.btn.warn{background:#fff7ed;border-color:#fed7aa;color:#c2410c}.btn.ghost{background:#f8fafc}.btn:disabled{opacity:.55;cursor:not-allowed}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid-2{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card-pad{padding:14px}.card-title{font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}.metric{padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}.metric:after{content:"";position:absolute;right:-24px;top:-34px;width:90px;height:90px;border-radius:50%;background:rgba(37,99,235,.08)}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:25px;font-weight:900;margin-top:4px;font-family:var(--mono)}.metric .trend{font-size:12px;margin-top:4px}.trend.up{color:var(--success)}.trend.down{color:var(--danger)}
    .filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}.field{height:32px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px;min-width:120px}.field.wide{min-width:260px}.risk{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;margin:8px 0}.risk.danger{border-color:#fecaca;background:#fef2f2;color:#991b1b}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}.b-draft{background:#f1f5f9;color:#475569}.b-wait{background:#fff7ed;color:#c2410c}.b-ok{background:#dcfce7;color:#15803d}.b-audit{background:#dbeafe;color:#1d4ed8}.b-bad{background:#fee2e2;color:#b91c1c}.b-part{background:#ede9fe;color:#6d28d9}.b-info{background:#e0f2fe;color:#0369a1}
    .table-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.toolbar{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:#fff}.toolbar .title{font-weight:800}.toolbar-spacer{flex:1}.table-scroll{overflow:auto;max-height:390px}table{width:100%;border-collapse:separate;border-spacing:0;min-width:920px}th,td{height:var(--row);padding:0 10px;border-bottom:1px solid #edf2f7;white-space:nowrap;text-align:left}th{background:#f8fafc;color:#334155;font-size:12px;font-weight:800;position:sticky;top:0;z-index:1;user-select:none}th.sortable{cursor:pointer}th.dragging{opacity:.45}td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}.row-warn td{background:#fff7ed}.row-danger td{background:#fff5f5}.sumbar{border-top:1px solid var(--line);background:#f8fafc;padding:8px 10px;color:#334155;display:flex;gap:18px;flex-wrap:wrap}.sumbar strong{font-family:var(--mono)}
    .form-panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form-item label{display:block;color:#64748b;font-size:12px;margin-bottom:4px}.form-item input,.form-item select{height:32px;border:1px solid var(--line);border-radius:9px;padding:0 9px;width:100%}.bill-summary{position:sticky;bottom:0;background:#0f172a;color:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;gap:18px;box-shadow:0 -10px 30px rgba(15,23,42,.18);z-index:2}.bill-summary .num{font-family:var(--mono);font-weight:900}.bill-summary .grow{flex:1}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:10px}.tab{padding:8px 10px;border-radius:9px 9px 0 0;cursor:pointer;color:#64748b}.tab.active{background:#eaf2ff;color:#1d4ed8;font-weight:800}
    .dropdown{position:relative}.drop-menu{display:none;position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;min-width:170px;z-index:7;padding:6px}.drop-menu.show{display:block}.drop-menu button{display:block;width:100%;text-align:left;background:#fff;border:0;height:32px;border-radius:8px;padding:0 10px}.drop-menu button:hover{background:#f1f5f9}
    .modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:20;align-items:center;justify-content:center}.modal-mask.show{display:flex}.modal{width:min(720px,92vw);background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden}.modal-head{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-weight:900}.modal-body{padding:14px;max-height:70vh;overflow:auto}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#f8fafc}.col-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col-box{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:260px}.col-row{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 8px;margin:6px 0;background:#fff}.handle{color:#94a3b8;cursor:grab}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:40}.toast.show{display:block;animation:fade .2s}.kbd{font-family:var(--mono);background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:1px 5px;font-size:12px;color:#334155}.split{display:grid;grid-template-columns:1fr 340px;gap:12px}.settle-side{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px}.settle-total{font-size:22px;font-family:var(--mono);font-weight:900}.danger-note{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:12px;padding:10px;margin-bottom:10px}.hint{color:#64748b;font-size:12px}.page-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini-list{display:grid;gap:8px}.mini-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}.link{color:#2563eb;cursor:pointer;font-weight:700}.focus-ring{outline:2px solid #93c5fd!important;outline-offset:1px}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brand-mark"></div><span>商贸云 ERP V1.0</span></div>
    <div class="crumb" id="crumb">工作台 / 经营概览</div>
    <input class="global-search" placeholder="全局搜索：客户 / 商品 / 单据号" />
    <div class="top-spacer"></div>
    <button class="icon-btn" onclick="showToast('导出中心：2个任务已完成')">⇩</button>
    <button class="icon-btn" onclick="showToast('消息：8个待办，3个风险预警')">●</button>
    <div class="user"><div class="avatar">管</div><span>系统管理员</span></div>
  </header>
  <aside class="side" id="nav"></aside>
  <main class="main">
    <section class="page active" id="dashboard"></section>
    <section class="page" id="sales"></section>
    <section class="page" id="purchase"></section>
    <section class="page" id="expense"></section>
    <section class="page" id="stock"></section>
    <section class="page" id="settle"></section>
    <section class="page" id="damage"></section>
    <section class="page" id="cost"></section>
  </main>
</div>
<div class="modal-mask" id="fieldModal"></div>
<div class="modal-mask" id="shortcutModal"></div>
<div class="toast" id="toast"></div>
<script>
const navs=[['dashboard','工作台','经营概览'],['sales','销售管理','销售快速开单'],['purchase','采购管理','采购订单'],['expense','采购管理','采购费用单'],['stock','库存管理','库存余额'],['settle','财务管理','应收结算'],['damage','库存管理','报损单'],['cost','库存管理','成本调整单']];
const sampleRows={
 sales:[['SO202606130001','华联超市','张三','总仓','¥350.00','¥0.00','¥350.00','已审核','库存正常'],['SO202606130002','城西便利','李娜','总仓','¥1,260.00','¥260.00','¥1,000.00','待审核','超信用'],['SO202606130003','民生烟酒','张三','东区仓','¥880.00','¥0.00','¥880.00','草稿','库存不足']],
 stock:[['SP001','农夫山泉500ml*24','总仓','1,200','180','0','1,020','300','¥12.0000','¥14,400.00'],['SP002','康师傅红烧牛肉面','总仓','88','20','0','68','120','¥42.5000','¥3,740.00'],['SP003','临期酸奶200g','冷藏仓','35','0','5','30','0','¥3.2000','¥112.00']],
 ar:[['AR202606130001','SR202606120031','华联超市','¥1,000.00','¥200.00','¥800.00','2026-07-12','5','未核销'],['AR202606130002','FE202606120002','万科物业','¥500.00','¥0.00','¥500.00','2026-06-30','0','未核销'],['AR202606130003','SR202606100014','城西便利','¥2,300.00','¥1,000.00','¥1,300.00','2026-06-10','3','部分核销']]
};
const gridConfigs={
 sales:{title:'销售订单数据网格',cols:['单据号','客户','业务员','仓库','订单金额','已收金额','未收金额','状态','风险'],rows:sampleRows.sales,num:[4,5,6]},
 stock:{title:'库存余额数据网格',cols:['商品编码','商品名称','仓库','实物库存','锁定库存','冻结库存','可用库存','采购在途','成本单价','库存金额'],rows:sampleRows.stock,num:[3,4,5,6,7,8,9]},
 ar:{title:'待结算应收数据网格',cols:['应收单号','来源单据','对象','应收金额','已收金额','未收金额','预计收款日','逾期天数','核销状态'],rows:sampleRows.ar,num:[3,4,5,7]}
};
let currentGrid='sales';
function init(){renderNav();renderDashboard();renderSales();renderPurchase();renderExpense();renderStock();renderSettle();renderDamage();renderCost();bindShortcuts();}
function renderNav(){let html='<div class="nav-title">V1.0 核心页面</div>';navs.forEach((n,i)=>html+=`<div class="nav-item ${i===0?'active':''}" data-page="${n[0]}"><span class="dot"></span><span>${n[2]}</span></div>`);document.getElementById('nav').innerHTML=html;document.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>switchPage(el.dataset.page));}
function switchPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===id));let item=navs.find(n=>n[0]===id);document.getElementById('crumb').textContent=item[1]+' / '+item[2];}
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><div class="page-title">${title}</div><div class="page-desc">${desc}</div></div><div class="head-actions">${actions}</div></div>`}
function renderDashboard(){document.getElementById('dashboard').innerHTML=pageHead('经营概览','业务待办、风险预警、销售/库存/财务关键指标','<button class="btn">刷新</button><button class="btn primary">进入销售开单</button>')+`<div class="grid-4"><div class="metric"><div class="label">今日销售额</div><div class="value">¥82,450</div><div class="trend up">▲ 12.4%</div></div><div class="metric"><div class="label">今日收款</div><div class="value">¥56,200</div><div class="trend up">▲ 8.1%</div></div><div class="metric"><div class="label">应收余额</div><div class="value">¥1.28M</div><div class="trend down">逾期 ¥126,000</div></div><div class="metric"><div class="label">库存金额</div><div class="value">¥3.86M</div><div class="trend up">低库存 48 SKU</div></div></div><div style="height:12px"></div><div class="grid-2"><div class="card card-pad"><div class="card-title">待办事项</div><div class="mini-list"><div class="mini-item"><span>待审核销售订单</span><b>12</b></div><div class="mini-item"><span>待审核采购费用</span><b>5</b></div><div class="mini-item"><span>待确认销售收货</span><b>16</b></div><div class="mini-item"><span>待付款应付</span><b>23</b></div></div></div><div class="card card-pad"><div class="card-title">风险预警</div><div class="mini-list"><div class="mini-item"><span>逾期应收</span><b style="color:var(--danger)">35</b></div><div class="mini-item"><span>临期商品</span><b style="color:var(--warn)">21</b></div><div class="mini-item"><span>超信用客户</span><b style="color:var(--danger)">8</b></div><div class="mini-item"><span>库存不足商品</span><b style="color:var(--warn)">48</b></div></div></div></div><div style="height:12px"></div><div class="grid-2"><div class="card card-pad"><div class="card-title">销售趋势</div>${fakeChart()}</div><div class="card card-pad"><div class="card-title">应收账龄</div>${bars()}</div></div>`}
function fakeChart(){return '<svg viewBox="0 0 600 190" width="100%" height="190"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2563eb" stop-opacity=".24"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs><path d="M0 145 C70 120 80 80 150 92 S260 145 330 94 430 38 520 68 570 88 600 52" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M0 145 C70 120 80 80 150 92 S260 145 330 94 430 38 520 68 570 88 600 52 L600 190 L0 190 Z" fill="url(#g)"/></svg>'}
function bars(){return '<div style="display:grid;gap:12px">'+[['未到期',62,'#16a34a'],['1-30天',28,'#f59e0b'],['31-60天',16,'#f97316'],['60天以上',9,'#dc2626']].map(b=>`<div><div style="display:flex;justify-content:space-between"><span>${b[0]}</span><b>${b[1]}%</b></div><div style="height:10px;background:#eef2f7;border-radius:99px"><div style="width:${b[1]}%;height:10px;background:${b[2]};border-radius:99px"></div></div></div>`).join('')+'</div>'}
function gridToolbar(key){return `<div class="toolbar"><span class="title">${gridConfigs[key].title}</span><span class="hint">拖拽表头、点击排序、字段设置自动保存</span><div class="toolbar-spacer"></div><button class="btn ghost" onclick="showToast('网格已刷新')">刷新</button><button class="btn ghost" onclick="toggleDensity()">密度</button><button class="btn" onclick="openFieldModal('${key}')">字段设置</button><div class="dropdown"><button class="btn" onclick="toggleExport(this)">导出 ▾</button><div class="drop-menu"><button onclick="exportMock('主单')">导出主单</button><button onclick="exportMock('明细')">导出明细</button><button onclick="exportMock('主单+明细')">导出主单+明细</button><button onclick="exportMock('当前页')">导出当前页</button></div></div></div>`}
function renderGrid(key){currentGrid=key;let cfg=loadCfg(key);let cols=cfg.cols;let rows=gridConfigs[key].rows;let visible=cols.filter(c=>c.visible);let th=visible.map(c=>`<th class="sortable ${gridConfigs[key].num.includes(c.idx)?'num':''}" draggable="true" data-idx="${c.idx}" onclick="sortGrid('${key}',${c.idx})">${gridConfigs[key].cols[c.idx]} <span>${c.sort||''}</span></th>`).join('');let body=rows.map((r,ri)=>`<tr class="${r.join('').includes('不足')?'row-danger':r.join('').includes('超信用')?'row-warn':''}">${visible.map(c=>cell(r[c.idx],c.idx,key)).join('')}</tr>`).join('');setTimeout(()=>bindDrag(key),30);return `<div class="table-wrap">${gridToolbar(key)}<div class="table-scroll"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>${sumBar(key,visible,rows)}</div>`}
function cell(v,idx,key){let isNum=gridConfigs[key].num.includes(idx);let cls=isNum?'num':'';let val=v||'';if(['已审核','已核销'].includes(val)) val='<span class="badge b-audit">'+val+'</span>'; if(['草稿','未核销'].includes(val)) val='<span class="badge b-draft">'+val+'</span>'; if(['待审核','部分核销'].includes(val)) val='<span class="badge b-wait">'+val+'</span>'; if(['超信用','库存不足'].includes(val)) val='<span class="badge b-bad">'+val+'</span>';return `<td class="${cls}">${val}</td>`}
function sumBar(key,visible,rows){let nums=visible.filter(c=>gridConfigs[key].num.includes(c.idx));let parts=nums.map(c=>{let total=rows.reduce((s,r)=>s+parseFloat(String(r[c.idx]||'0').replace(/[¥,]/g,''))||s,0);return `${gridConfigs[key].cols[c.idx]} <strong>${gridConfigs[key].cols[c.idx].includes('金额')||gridConfigs[key].cols[c.idx].includes('成本')||gridConfigs[key].cols[c.idx].includes('收')?'¥':''}${total.toLocaleString('zh-CN',{maximumFractionDigits:2})}</strong>`});return `<div class="sumbar"><span>当前页合计：</span>${parts.map(p=>`<span>${p}</span>`).join('')}<span style="margin-left:auto">查询总合计：<strong>当前页 × 18</strong></span></div>`}
function defaultCfg(key){return {cols:gridConfigs[key].cols.map((_,i)=>({idx:i,visible:true,width:120,sort:null}))}}
function loadCfg(key){let s=localStorage.getItem('grid-'+key);return s?JSON.parse(s):defaultCfg(key)}
function saveCfg(key,cfg){localStorage.setItem('grid-'+key,JSON.stringify(cfg))}
function sortGrid(key,idx){let cfg=loadCfg(key);cfg.cols.forEach(c=>{if(c.idx!==idx)c.sort=null});let col=cfg.cols.find(c=>c.idx===idx);col.sort=col.sort==='↑'?'↓':col.sort==='↓'?null:'↑';saveCfg(key,cfg);document.querySelector('.page.active').innerHTML=document.querySelector('.page.active').innerHTML;rerenderCurrent();showToast('已按 '+gridConfigs[key].cols[idx]+' 排序')}
function bindDrag(key){document.querySelectorAll('th[draggable=true]').forEach(th=>{th.ondragstart=e=>{e.dataTransfer.setData('idx',th.dataset.idx);th.classList.add('dragging')};th.ondragend=()=>th.classList.remove('dragging');th.ondragover=e=>e.preventDefault();th.ondrop=e=>{e.preventDefault();let from=+e.dataTransfer.getData('idx'),to=+th.dataset.idx;let cfg=loadCfg(key);let a=cfg.cols.findIndex(c=>c.idx===from),b=cfg.cols.findIndex(c=>c.idx===to);let [m]=cfg.cols.splice(a,1);cfg.cols.splice(b,0,m);saveCfg(key,cfg);rerenderCurrent();showToast('字段顺序已自动保存')}})}
function openFieldModal(key){let cfg=loadCfg(key);let rows=cfg.cols.map(c=>`<label class="col-row"><span class="handle">⋮⋮</span><input type="checkbox" ${c.visible?'checked':''} data-col="${c.idx}"><span>${gridConfigs[key].cols[c.idx]}</span></label>`).join('');document.getElementById('fieldModal').innerHTML=`<div class="modal"><div class="modal-head">字段设置 - ${gridConfigs[key].title}<span style="margin-left:auto" class="hint">设置会按账号自动保存</span></div><div class="modal-body"><div class="col-list"><div class="col-box"><b>已显示 / 可拖拽排序</b>${rows}</div><div class="col-box"><b>说明</b><p class="hint">取消勾选可隐藏字段；保存后当前网格立即按新顺序展示。成本类字段会受权限控制。</p><p><span class="kbd">拖拽表头</span> 可快速调整顺序</p><p><span class="kbd">点击表头</span> 可排序</p><p><span class="kbd">导出</span> 默认按当前字段设置导出</p></div></div></div><div class="modal-foot"><button class="btn" onclick="resetGrid('${key}')">恢复默认</button><button class="btn" onclick="closeModal('fieldModal')">取消</button><button class="btn primary" onclick="saveFieldModal('${key}')">保存</button></div></div>`;document.getElementById('fieldModal').classList.add('show')}
function saveFieldModal(key){let cfg=loadCfg(key);document.querySelectorAll('#fieldModal [data-col]').forEach(ch=>{cfg.cols.find(c=>c.idx==ch.dataset.col).visible=ch.checked});saveCfg(key,cfg);closeModal('fieldModal');rerenderCurrent();showToast('字段设置已保存，下次进入仍生效')}
function resetGrid(key){localStorage.removeItem('grid-'+key);closeModal('fieldModal');rerenderCurrent();showToast('已恢复系统默认字段')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleExport(btn){btn.nextElementSibling.classList.toggle('show')}function exportMock(type){showToast('已创建导出任务：'+type+'，请到导出中心下载');document.querySelectorAll('.drop-menu').forEach(m=>m.classList.remove('show'))}
function toggleDensity(){let r=getComputedStyle(document.documentElement).getPropertyValue('--row').trim();document.documentElement.style.setProperty('--row',r==='34px'?'42px':r==='42px'?'30px':'34px');showToast('表格密度已切换并保存')}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function rerenderCurrent(){let id=document.querySelector('.page.active').id;({dashboard:renderDashboard,sales:renderSales,purchase:renderPurchase,expense:renderExpense,stock:renderStock,settle:renderSettle,damage:renderDamage,cost:renderCost}[id])()}
function renderSales(){document.getElementById('sales').innerHTML=pageHead('销售快速开单','最高频录单页面：支持扫码、快捷键、信用/库存/低价实时校验','<button class="btn" onclick="openShortcut()">快捷键帮助</button><button class="btn primary" onclick="showToast(\'订单已审核并打印\')">审核并打印</button>')+`<div class="form-panel"><div class="form-grid"><div class="form-item"><label>客户 F2</label><input id="customerInput" value="华联超市" /></div><div class="form-item"><label>仓库</label><select><option>总仓</option><option>东区仓</option></select></div><div class="form-item"><label>业务员</label><input value="张三" /></div><div class="form-item"><label>结算方式</label><select><option>月结30天</option><option>现结</option></select></div></div><div class="risk">⚠ 欠款 ¥12,000　逾期 ¥2,000　信用额度 ¥50,000　可用额度 ¥38,000</div><div class="form-grid"><div class="form-item" style="grid-column:1/4"><label>商品/扫码 F3</label><input id="goodsInput" placeholder="扫码/编码/名称/简拼，回车带入商品" /></div><div class="form-item"><label>快速操作</label><button class="btn">常购F4</button> <button class="btn">赠品F7</button></div></div></div>${renderGrid('sales')}<div class="bill-summary"><span>商品金额 <b class="num">¥2,490.00</b></span><span>优惠 <b class="num">¥260.00</b></span><span>应收 <b class="num">¥2,230.00</b></span><span>已收 <b class="num">¥260.00</b></span><span>未收 <b class="num">¥1,970.00</b></span><span class="grow"></span><button class="btn">挂单</button><button class="btn">保存草稿F5</button><button class="btn primary">审核F6</button></div>`}
function renderPurchase(){document.getElementById('purchase').innerHTML=pageHead('采购订单','供应商订货、预计到货、成本字段与入库状态联动','<button class="btn">历史采购F4</button><button class="btn primary">审核</button>')+`<div class="form-panel"><div class="form-grid"><div class="form-item"><label>供应商 F2</label><input value="农夫山泉杭州经销" /></div><div class="form-item"><label>采购员</label><input value="李四" /></div><div class="form-item"><label>收货仓库</label><select><option>总仓</option></select></div><div class="form-item"><label>预计到货</label><input value="2026-06-18" /></div></div></div>${billTable('采购商品明细',['商品','单位','数量','单价','税率','金额','成本单价','成本金额','已入库'],[['农夫山泉500ml*24','箱','100','35.00','13%','3,500.00','31.2000','3,120.00','0'],['康师傅红烧牛肉面','箱','50','48.00','13%','2,400.00','42.5000','2,125.00','0']])}<div class="bill-summary"><span>商品金额 <b class="num">¥5,900.00</b></span><span>税额 <b class="num">¥767.00</b></span><span>费用分摊 <b class="num">¥0.00</b></span><span>应付预估 <b class="num">¥6,667.00</b></span><span class="grow"></span><button class="btn">保存草稿</button><button class="btn primary">提交审核</button></div>`}
function renderExpense(){document.getElementById('expense').innerHTML=pageHead('采购费用单','费用分摊到采购入库单，审核后重算成本','<button class="btn">分摊预览</button><button class="btn primary">审核并重算成本</button>')+`<div class="form-panel"><div class="form-grid"><div class="form-item"><label>费用类型</label><select><option>运费</option><option>装卸费</option></select></div><div class="form-item"><label>收款对象</label><select><option>供应商</option><option>往来单位</option></select></div><div class="form-item"><label>供应商</label><input value="顺丰物流" /></div><div class="form-item"><label>分摊方式</label><select><option>按金额</option><option>按数量</option><option>按重量</option><option>手工</option></select></div><div class="form-item"><label>费用金额</label><input value="1000.00" /></div><div class="form-item"><label>税率</label><input value="9%" /></div><div class="form-item"><label>税额</label><input value="90.00" /></div><div class="form-item"><label>是否生成应付</label><select><option>是</option><option>否</option></select></div></div></div><div class="danger-note">审核后将重算采购入库成本，可能影响后续出库成本和毛利，请确认分摊结果。</div>${billTable('分摊预览',['入库单','入库金额','分摊基数','比例','分摊金额','分摊后成本金额','分摊后成本单价'],[['PI202606130001','10,000.00','10,000','33.33%','333.33','10,333.33','103.3333'],['PI202606130002','20,000.00','20,000','66.67%','666.67','20,666.67','103.3334']])}<div class="bill-summary"><span>费用金额 <b class="num">¥1,000.00</b></span><span>已分摊 <b class="num">¥1,000.00</b></span><span>未分摊 <b class="num">¥0.00</b></span><span class="grow"></span><button class="btn primary">审核并重算成本</button></div>`}
function renderStock(){document.getElementById('stock').innerHTML=pageHead('库存余额','库存、锁定、在途、成本金额统一查询；支持字段设置、排序、汇总、导出','<button class="btn">库存流水</button><button class="btn primary">库存调整</button>')+`<div class="filter"><input class="field wide" placeholder="商品编码/名称/条码"/><select class="field"><option>全部仓库</option><option>总仓</option></select><select class="field"><option>全部状态</option><option>缺货</option><option>低库存</option></select><button class="btn primary">查询</button><button class="btn">重置</button></div>${renderGrid('stock')}`}
function renderSettle(){document.getElementById('settle').innerHTML=pageHead('应收结算','客户/往来单位快速收款并核销；支持折让、打印结算单','<button class="btn">打印结算单</button><button class="btn primary">生成收款单并核销</button>')+`<div class="split"><div>${renderGrid('ar')}</div><aside class="settle-side"><div class="card-title">本次结算</div><div class="form-item"><label>对象类型</label><select><option>客户</option><option>往来单位</option></select></div><br><div class="form-item"><label>结算对象</label><input value="华联超市" /></div><br><div class="form-item"><label>收款方式</label><select><option>银行转账</option><option>现金</option><option>微信</option></select></div><br><div class="form-item"><label>资金账户</label><select><option>工行基本户</option></select></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="hint">已选应收</div><div class="settle-total">¥800.00</div><div class="form-item"><label>本次收款</label><input value="800.00" /></div><br><div class="form-item"><label>折让金额</label><input value="0.00" /></div><br><button class="btn primary" style="width:100%">生成收款单并核销</button></aside></div>`}
function renderDamage(){document.getElementById('damage').innerHTML=pageHead('报损单','过期、破损、不可售商品报损出库；形成公司损失','<button class="btn">上传照片</button><button class="btn danger">审核报损</button>')+`<div class="danger-note">⚠ 报损会直接减少库存并形成公司损失，请确认商品、批次和数量。</div><div class="form-panel"><div class="form-grid"><div class="form-item"><label>仓库</label><select><option>总仓</option><option>冷藏仓</option></select></div><div class="form-item"><label>报损类型</label><select><option>过期报损</option><option>破损报损</option><option>质量异常</option></select></div><div class="form-item"><label>申请人</label><input value="张三" /></div><div class="form-item"><label>报损日期</label><input value="2026-06-13" /></div></div></div>${billTable('报损商品明细',['商品','批次','生产日期','到期日期','可用库存','报损数量','成本单价','成本金额','原因'],[['临期酸奶200g','B20260401','2026-04-01','2026-06-12','30','20','3.2000','64.00','过期'],['破损矿泉水','B20260518','2026-05-18','2027-05-18','80','5','12.0000','60.00','包装破损']])}<div class="bill-summary"><span>报损数量 <b class="num">25</b></span><span>报损成本金额 <b class="num">¥124.00</b></span><span class="grow"></span><button class="btn">保存</button><button class="btn danger">审核报损</button></div>`}
function renderCost(){document.getElementById('cost').innerHTML=pageHead('成本调整单','调整库存成本单价/金额，不改变库存数量','<button class="btn">保存草稿</button><button class="btn warn">审核调整</button>')+`<div class="risk danger">注意：成本调整不改变库存数量，但会影响后续出库成本和毛利。</div><div class="form-panel"><div class="form-grid"><div class="form-item"><label>仓库</label><select><option>总仓</option></select></div><div class="form-item"><label>成本分组</label><input value="CG01" /></div><div class="form-item"><label>调整方式</label><select><option>按单价</option><option>按金额</option></select></div><div class="form-item"><label>调整日期</label><input value="2026-06-13" /></div><div class="form-item" style="grid-column:1/5"><label>调整原因</label><input value="采购费用补录后成本修正" /></div></div></div>${billTable('成本调整明细',['商品','库存数量','调整前成本','调整后成本','调整前金额','调整后金额','差异金额'],[['农夫山泉500ml*24','1,200','12.0000','12.2800','14,400.00','14,736.00','336.00'],['康师傅红烧牛肉面','88','42.5000','42.6600','3,740.00','3,754.08','14.08']])}<div class="bill-summary"><span>库存数量不变</span><span>调整差异金额 <b class="num">¥350.08</b></span><span class="grow"></span><button class="btn warn">审核调整</button></div>`}
function billTable(title,cols,rows){return `<div class="table-wrap"><div class="toolbar"><span class="title">${title}</span><div class="toolbar-spacer"></div><button class="btn" onclick="showToast('新增明细行 F7')">新增行F7</button><button class="btn" onclick="exportMock('明细')">导出明细</button></div><div class="table-scroll"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${/[金额价数量库存]/.test(cols[i])?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="sumbar"><span>当前页合计：数量 <strong>125</strong></span><span>金额 <strong>¥12,474.08</strong></span></div></div>`}
function openShortcut(){document.getElementById('shortcutModal').innerHTML=`<div class="modal"><div class="modal-head">快捷键帮助</div><div class="modal-body"><div class="page-grid"><div class="mini-item"><span>聚焦客户/供应商</span><b class="kbd">F2</b></div><div class="mini-item"><span>聚焦商品扫码</span><b class="kbd">F3</b></div><div class="mini-item"><span>常购/历史商品</span><b class="kbd">F4</b></div><div class="mini-item"><span>保存草稿</span><b class="kbd">F5 / Ctrl+S</b></div><div class="mini-item"><span>提交/审核</span><b class="kbd">F6 / Ctrl+Enter</b></div><div class="mini-item"><span>新增明细行</span><b class="kbd">F7</b></div><div class="mini-item"><span>删除当前行</span><b class="kbd">F8</b></div><div class="mini-item"><span>重算金额</span><b class="kbd">F9</b></div></div></div><div class="modal-foot"><button class="btn primary" onclick="closeModal('shortcutModal')">知道了</button></div></div>`;document.getElementById('shortcutModal').classList.add('show')}
function bindShortcuts(){document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();let el=document.getElementById('customerInput');if(el){el.focus();el.classList.add('focus-ring');showToast('已聚焦主对象 F2')}}if(e.key==='F3'){e.preventDefault();let el=document.getElementById('goodsInput');if(el){el.focus();el.classList.add('focus-ring');showToast('已聚焦商品扫码 F3')}}if(e.key==='F7'){e.preventDefault();showToast('已新增一行明细')}if(e.key==='F8'){e.preventDefault();showToast('已删除当前明细行')}if(e.key==='F9'){e.preventDefault();showToast('金额、税额、成本已重新计算')}if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();showToast('草稿已保存')}if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();showToast('已提交/审核')}})}
init();
</script>
</body>
