<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>数据初始化向导原型</title><link rel="stylesheet" href="../assets/module-style.css"><style>.page{height:100vh;background:#f5f6f8;display:grid;grid-template-columns:260px 1fr}.steps{background:#fff;border-right:1px solid #e5eaf2;padding:20px}.step{height:42px;display:flex;align-items:center;border-radius:8px;padding:0 12px;margin:6px 0}.step.on{background:#eaf2ff;color:#1677ff;font-weight:700}.main{padding:18px;overflow:auto}.card{background:#fff;border:1px solid #e5eaf2;border-radius:8px;padding:20px}.upload{border:2px dashed #cbd5e1;border-radius:10px;padding:28px;text-align:center;color:#667085;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid #e5eaf2;border-radius:8px;padding:14px}.metric b{font-size:22px}.btn{height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 18px}.btn.primary{background:#1677ff;color:#fff}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px}</style></head><body><aside class="steps"><h2>初始化向导</h2><div class="step on">1 初始化说明</div><div class="step">2 基础资料导入</div><div class="step">3 期初库存</div><div class="step">4 期初应收</div><div class="step">5 期初应付</div><div class="step">6 预收/预付</div><div class="step">7 资金账户</div><div class="step">8 校验确认</div></aside><main class="main"><div class="card"><h2>期初数据初始化</h2><p>通过向导导入商品、客户、供应商、库存、应收、应付、预收预付和资金账户期初数据。系统启用后期初数据将锁定。</p><div class="grid"><div class="metric">商品资料<br><b>4645</b></div><div class="metric">期初库存<br><b>12,350</b></div><div class="metric">期初应收<br><b>¥126,000</b></div><div class="metric">资金账户<br><b>¥58,000</b></div></div><div class="upload"><h3>上传当前步骤Excel模板</h3><p>支持下载模板、上传文件、预校验、失败原因下载。</p><button class="btn">下载模板</button> <button class="btn primary" onclick="toast('文件已上传，校验通过')">上传文件</button></div><table class="matrix"><tr><th>初始化对象</th><th>总数</th><th>成功</th><th>失败</th><th>状态</th><th>操作</t
