<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>成本调整单原型</title><link rel="stylesheet" href="../assets/module-style.css"><style>.page{height:100vh;padding:12px;background:#f5f6f8}.card{height:100%;display:flex;flex-direction:column}.head{height:56px;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;padding:0 18px}.head h2{margin:0}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 40px}.block{padding:16px 20px;border-bottom:1px solid #eef2f6}.content{flex:1;overflow:auto}.risk{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:10px;margin:10px 0}.btn{height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 18px}.btn.warn{background:#fff7ed;color:#c2410c}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px}</style></head><body><div class="page"><div class="card"><div class="head"><h2>成本调整单 CA202606130001</h2><div style="margin-left:auto"><button class="btn">保存草稿</button><button class="btn warn" onclick="toast('成本调整已审核，库存数量不变')">审核调整</button></div></div><div class="block"><div class="risk">成本调整不改变库存数量，但会影响后续出库成本和毛利。</div><div class="grid4"><label class="field">仓库<select><option>总仓</option></select></label><label class="field">成本分组<input value="CG01"></label><label class="field">调整方式<select><option>按单价</option><option>按金额</option></select></label><label class="field">调整日期<input value="2026-06-13"></label><label class="field" style="grid-column:1/5">调整原因<input value="采购费用补录后成本修正"></label></div></div><div class="content"><table class="matrix"><tr><th>商品</th><th>批次</th><th>库存数量</th><th>调整前成本</th><th>调整后成本</th><th>调整前金额</th><th>调整后金额</th><th>差异金额</th></tr><tr><td>农夫山泉500ml*24</td><td>B202606</td><td>1200</td><td>12.0000</td><td contenteditable oninput="calc()" id="after">12.2800</td><td>14400.00</td><td id="afterAmt">14736.00</td><td id="diff">336.00</td></tr></table></div><div class="summary"><span>库存数量不变</span><span>调整差异金额 <b id="sum">¥336.00</b></span></div></div></div><div id="toast" class="toast"></div><script>function calc(){let v=+after.textContent||0,a=v*1200,d=a-14400;afterAmt.textContent=a.toFixed(2);diff.textContent=d.toFixed(2);sum.textContent='¥'+d.toFixed(2)}function toast(m){toast.textContent=m;toast.style.display='block';setTimeout(()=>toast.style.display='none',2000)}</script></body></html>
