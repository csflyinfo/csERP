<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品档案高保真交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#364152;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px}.top{height:40px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center}.tab{height:40px;padding:0 22px;display:flex;align-items:center;border-right:1px solid #e5e9f0}.tab.active{background:#d9d9d9}.sys{margin-left:auto;padding-right:24px}.wrap{height:calc(100vh - 40px);padding:10px 0;display:grid;grid-template-columns:190px 1fr;gap:8px}.tree{background:#fff;padding:10px 8px;overflow:auto}.tree div{height:29px;line-height:29px;padding-left:12px;cursor:pointer}.tree div:hover,.tree .sel{background:#eef6ff;color:#1677ff}.main{background:#fff;border-radius:6px;padding:18px 12px 0;overflow:hidden}.status{display:flex;gap:34px;height:36px;align-items:flex-start;font-size:16px}.status span{cursor:pointer}.status .on{color:#1677ff;border-bottom:2px solid #1677ff;padding-bottom:10px}.query{display:flex;gap:10px;align-items:center;margin:8px 0 20px}.query input,.query select{height:36px;border:1px solid #dbe3ef;border-radius:5px;padding:0 12px;color:#98a2b3;background:#fff;min-width:160px}.query .wide{width:240px}.query .spacer{flex:1}.btn{height:40px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 22px;color:#475467;cursor:pointer}.btn.primary{background:#1677ff;border-color:#1677ff;color:#fff}.ops{display:flex;justify-content:flex-end;gap:10px;margin-bottom:10px}.tablebox{height:calc(100vh - 238px);border:1px solid #e5eaf2;overflow:auto;position:relative}table{border-collapse:collapse;width:2100px;background:#fff}th,td{border-right:1px solid #e5eaf2;border-bottom:1px solid #edf1f5;text-align:center;height:54px;padding:0 12px;white-space:nowrap}th{background:#f5f7fa;font-weight:700;color:#344054;position:sticky;top:0;z-index:2}.fix{position:sticky;right:0;background:#fff;box-shadow:-8px 0 16px rgba(16,24,40,.08)}th.fix{background:#f5f7fa}.link{color:#1677ff;margin:0 6px;cursor:pointer}.foot{height:54px;display:flex;align-items:center}.foot .right{margin-left:auto;display:flex;gap:14px;align-items:center}.pagebtn{height:32px;min-width:32px;border:1px solid #dbe3ef;border-radius:4px;background:#fff}.pagebtn.on{background:#1677ff;color:#fff}.modalMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center}.modalMask.show{display:flex}.modal{background:#fff;border-radius:4px;box-shadow:0 20px 80px rgba(0,0,0,.25);position:relative}.edit{width:1240px;height:760px;display:flex;flex-direction:column}.mh{height:54px;display:flex;align-items:center;padding:0 24px;font-size:22px}.close{margin-left:auto;font-size:26px;color:#98a2b3;cursor:pointer}.tabs{height:50px;margin:0 24px;border-bottom:1px solid #d0d5dd;display:flex;gap:36px;position:sticky;top:0;background:#fff;z-index:5}.tabs span{height:50px;line-height:50px;font-size:16px;cursor:pointer}.tabs .on{color:#1677ff;border-bottom:2px solid #1677ff}.body{padding:0 64px 30px;overflow:auto;flex:1;scroll-behavior:smooth}.section{padding-top:34px;min-height:250px}.sec{font-size:18px;font-weight:700;margin:18px 0 22px}.sec:before{content:"";display:inline-block;width:5px;height:16px;background:#1677ff;margin-right:10px;vertical-align:-2px}.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 64px}.form2{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 64px}.field{display:flex;align-items:center;gap:14px;font-weight:700}.field b{color:#f04438}.field input,.field select{height:40px;border:1px solid #dbe3ef;border-radius:5px;padding:0 14px;min-width:184px;color:#596273;background:#fff}.field input:disabled,.field select:disabled{background:#f3f5f8;color:#98a2b3}.matrix{width:100%;border-collapse:collapse;margin:10px 0 30px}.matrix th,.matrix td{height:50px;border:1px solid #e5eaf2;text-align:center}.matrix th{background:#f7f8fa}.step{display:inline-flex;height:38px;border:1px solid #dbe3ef;border-radius:5px;overflow:hidden}.step button{width:42px;border:0;background:#f5f7fa;font-size:20px;color:#667085}.step input{width:142px;border:0;text-align:center;font-weight:600}.disabled{opacity:.42}.bottom{height:64px;border-top:1px solid #e5eaf2;display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:0 22px}.batch{width:900px;min-height:560px}.batch h2{margin:24px}.batchGrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 32px;padding:10px 24px 30px}.batchGrid label{display:flex;align-items:center;gap:12px}.batchGrid select,.batchGrid input{height:42px;border:1px solid #dbe3ef;border-radius:5px;padding:0 12px;min-width:220px}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px;z-index:50}.toast.show{display:block}</style>
</head>
<body>
<div class="top"><div class="tab">首页 ×</div><div class="tab active">商品档案 ×</div><div class="sys">中科云联ERP管理系统-梅州翔达</div></div>
<div class="wrap"><aside class="tree" id="tree"></aside><main class="main"><div class="status"><span class="on">正常(4624)</span><span>全部(4645)</span><span>停用(21)</span></div><div class="query"><select><option>综合查询</option></select><input placeholder="请输入"><input class="wide" placeholder="请输入商品编号或名称"><select><option>请选择品牌</option></select><select><option>是否赠品</option></select><span class="spacer"></span><span>⌄ 展开</span><button class="btn primary" onclick="toast('已搜索')">🔍 搜索</button><button class="btn">重置</button></div><div class="ops"><button class="btn primary" onclick="openEdit('新增商品')">新增</button><button class="btn" disabled>删除</button><button class="btn" onclick="openBatch()">批量编辑</button><button class="btn">导入⌄</button><button class="btn" onclick="toast('已创建导出任务')">导出</button></div><div class="tablebox"><table><thead><tr><th><input type="checkbox"></th><th>序号</th><th>商品编号</th><th>商品名称</th><th>规格型号</th><th>商品分类</th><th>品牌</th><th>商品类型</th><th>基本单位</th><th>基本条码</th><th>保质期(天)</th><th>存储属性</th><th>是否可售</th><th>是否可采购</th><th>是否可退</th><th>是否称重</th><th>是否预售</th><th>标准售价</th><th>参考进价</th><th>最低售价</th><th>建议零售价</th><th>默认供应商</th><th>默认仓库</th><th>商品负责人</th><th>状态</th><th class="fix">操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="foot"><span>已选 <b id="sel">0</b> 条</span><div class="right"><span>当前页共计 <b style="color:#1677ff">50</b> 条　共 4624 条</span><button class="pagebtn">20条/页</button><button class="pagebtn">‹</button><button class="pagebtn on">1</button><button class="pagebtn">›</button><span>前往</span><button class="pagebtn">1</button><span>页</span></div></div></main></div>
<div class="modalMask" id="mask"></div><div class="toast" id="toast"></div>
<script>
const tree=['全部商品','zk酒水饮料','▾ 全部商品','　▸ 水乳饮品','　▾ 酒类专区','　　白酒','　　啤酒','　　鸡尾酒','　　保健酒','　　其他酒类','　▸ 小零食区','　▸ 休闲零食','　▸ 糖果糖玩','　▸ 饼干糕点','　▸ 冲调商品','　▸ 方便食品','　▸ 散装食品','　▸ 调味品类','　▸ 粮油米类','　▸ 家居百货','　▸ 文具办公','　▸ 日化护理'];
tree.forEach((x,i)=>document.getElementById('tree').insertAdjacentHTML('beforeend',`<div class="${i==0?'sel':''}" onclick="document.querySelectorAll('.tree div').forEach(n=>n.classList.remove('sel'));this.classList.add('sel');toast('分类：${x.replace(/[▾▸　]/g,'')}')">${x}</div>`));
const rows=[['16561','百草味每日坚果乳[310g]','310g','活动商品','百草味','正常','瓶','6941410749551','365','常温','是','是','否','否','否','2.40','1.00','2.10','3.00','百草味供应商','总仓','王五','正常'],['16560','可口可乐雪碧清爽柠檬[2L]','2L','碳酸饮料','可口可乐','正常','瓶','690787820027','365','常温','是','是','是','否','否','6.40','4.00','5.80','7.50','可口可乐经销','总仓','李四','正常'],['16559','笋同学多味脆笋','1*8盒*50包','5角零食','笋同学','正常','包','6977642140019','180','常温','是','是','是','否','否','0.40','0.26','0.35','0.50','笋同学食品','总仓','王五','正常'],['16557','丽芝士注心曲奇饼干清新草莓味[90g]','90g','饼干糕点','丽芝士','正常','盒','8993175548724','270','常温','是','是','是','否','否','4.80','3.10','4.20','5.50','丽芝士供应商','总仓','赵六','正常']];
rows.forEach((r,i)=>tbody.insertAdjacentHTML('beforeend',`<tr><td><input type="checkbox" onchange="sel.textContent=document.querySelectorAll('tbody input:checked').length"></td><td>${i+1}</td>${r.map(x=>`<td>${x}</td>`).join('')}<td class="fix"><span class="link" onclick="openEdit('修改商品')">编辑</span><span class="link">删除</span></td></tr>`));
function unitMatrix(){return `<div class="sec">单位设置 <span style="font-size:14px;font-weight:400;color:#667085">（库存底层统一按基本单位存储，其他单位按换算率折算。）</span></div><table class="matrix"><tr><th>单位设置</th><th>基本单位</th><th>大单位</th><th>中单位</th></tr><tr><td>是否启用单位</td><td>☑</td><td>☐</td><td>☐</td></tr><tr><td><b>*</b> 选择单位</td><td><select><option>瓶</option></select></td><td><select><option>箱</option></select></td><td><select><option>请选择</option></select></td></tr><tr><td>单位条码</td><td><input value="6941410749551"></td><td><input value=""></td><td><input value=""></td></tr><tr><td><b>*</b> 单位换算</td><td>1</td><td><span class="step"><button>-</button><input value="24"><button>+</button></span></td><td><span class="step"><button>-</button><input><button>+</button></span></td></tr><tr><td>重量(kg)</td><td><span class="step"><button>-</button><input><button>+</button></span></td><td><span class="step"><button>-</button><input><button>+</button></span></td><td><span class="step"><button>-</button><input><button>+</button></span></td></tr><tr><td>体积(m³)</td><td><span class="step"><button>-</button><input><button>+</button></span></td><td><span class="step"><button>-</button><input><button>+</button></span></td><td><span class="step"><button>-</button><input><button>+</button></span></td></tr></table>`}
function priceMatrix(){return `<div class="sec">价格设置 <label style="float:right;font-size:14px"><input type="checkbox" checked> 多单位价格联动</label></div><table class="matrix"><tr><th>价格项</th><th>基本单位</th><th>大单位</th><th>中单位</th></tr>${['标准售价','最低售价','参考进价','建议零售价','价格组1','价格组2','价格组3'].map((r,i)=>`<tr><td>${r}</td><td><span class="step"><button>-</button><input value="${i==0?'2.400000':i==2?'1.000000':i==3?'3.000000':''}"><button>+</button></span></td><td><span class="step"><button>-</button><input><button>+</button></span></td><td><span class="step"><button>-</button><input><button>+</button></span></td></tr>`).join('')}</table>`}
function whMatrix(){return `<div class="sec">采购与库存设置</div><div class="form3"><label class="field">默认供应商<select><option>请选择默认供应商</option></select></label><label class="field">默认仓库<select><option>总仓</option></select></label><label class="field">税率%<span class="step"><button>-</button><input value="13"><button>+</button></span></label><label class="field">起订量<input value="1"></label><label class="field">起订倍数<input value="1"></label><label class="field">库存上限<input value="5000"></label><label class="field">库存下限<input value="100"></label><label class="field">临期预警天数<input value="30"></label></div>`}
function openEdit(title){mask.innerHTML=`<div class="modal edit"><div class="mh">${title}<span class="close" onclick="closeM()">×</span></div><div class="tabs" id="editTabs"><span class="on" onclick="jumpSec('base')">基础档案</span><span onclick="jumpSec('unit')">单位设置</span><span onclick="jumpSec('price')">价格设置</span><span onclick="jumpSec('intro')">商品介绍</span></div><div class="body" id="editBody" onscroll="syncTabs()"><section class="section" id="base"><div class="sec">基础档案</div><div class="form3"><label class="field">商品编码<input disabled value="16561"></label><label class="field"><b>*</b> 商品名称<input value="百草味每日坚果乳[310g]"></label><label class="field"><b>*</b> 规格型号<input value="310g"></label><label class="field"><b>*</b> 商品分类<select><option>全部商品 / 特产</option></select></label><label class="field">品牌<select><option>百草味</option></select></label><label class="field"><b>*</b> 商品类型<select><option>正常</option><option>赠品</option><option>包装辅料</option><option>耗材</option></select></label><label class="field">保质期天数<input value="365"></label><label class="field">存储属性<select><option>常温</option><option>冷藏</option><option>冷冻</option></select></label><label class="field">是否可售<select><option>是</option><option>否</option></select></label><label class="field">是否可采购<select><option>是</option><option>否</option></select></label><label class="field">是否可退<select><option>是</option><option>否</option></select></label><label class="field">是否称重<select><option>否</option><option>是</option></select></label><label class="field">是否预售<select><option>否</option><option>是</option></select></label><label class="field">产地<input placeholder="请输入产地"></label><label class="field">外部编号<input placeholder="请输入外部编号"></label><label class="field">商品负责人<select><option>请选择商品负责人</option></select></label><label class="field">状态<select><option>正常</option><option>停用</option></select></label><label class="field">默认供应商<select><option>请选择默认供应商</option></select></label><label class="field">默认仓库<select><option>总仓</option></select></label><label class="field"><b>*</b> 税率%<span class="step"><button>-</button><input value="13"><button>+</button></span></label><label class="field">起订量<input value="1"></label><label class="field">起订倍数<input value="1"></label><label class="field">库存上限<input value="5000"></label><label class="field">库存下限<input value="100"></label><label class="field">临期预警天数<input value="30"></label></div></section><section class="section" id="unit">${unitMatrix()}</section><section class="section" id="price">${priceMatrix()}</section><section class="section" id="intro"><div class="sec">商品介绍</div><textarea style="width:100%;height:260px;border:1px solid #dbe3ef;border-radius:6px;padding:12px" placeholder="商品介绍、图片附件说明"></textarea></section></div><div class="bottom"><button class="btn primary" onclick="toast('保存并继续')">保存并继续</button><button class="btn">复制新增</button><button class="btn" onclick="closeM();toast('保存并退出')">保存并退出</button><button class="btn" onclick="closeM()">取消</button></div></div>`;mask.classList.add('show')}
function jumpSec(id){document.getElementById(id).scrollIntoView({block:'start',behavior:'smooth'});setTimeout(syncTabs,260)}
const secIds=['base','unit','price','intro'];function syncTabs(){let body=document.getElementById('editBody');if(!body)return;let active=0;secIds.forEach((id,i)=>{let el=document.getElementById(id);if(el&&el.offsetTop-body.scrollTop<170)active=i});document.querySelectorAll('#editTabs span').forEach((x,i)=>x.classList.toggle('on',i===active))}
function closeM(){mask.classList.remove('show')}function openBatch(){mask.innerHTML=`<div class="modal batch"><h2>批量编辑</h2><div class="batchGrid">${['品牌','类别','是否可退','是否可售','是否可采购','状态','保质期天数','临期预警天数','库存上限','库存下限','默认供应商','商品负责人','多单位价格联动'].map((x,i)=>`<label><input type="checkbox"> ${x}：${i>=6&&i<=9?'<span class="step"><button>-</button><input placeholder="请输入整数"><button>+</button></span>':'<select><option>请选择</option><option>是</option><option>否</option></select>'}</label>`).join('')}</div><div class="bottom"><button class="btn" onclick="closeM()">取消</button><button class="btn primary" onclick="closeM();toast('批量编辑已应用')">确定</button></div></div>`;mask.classList.add('show')}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2200)}</script></body></html>
