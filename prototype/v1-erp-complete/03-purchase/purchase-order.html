<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>采购订单原型</title><link rel="stylesheet" href="../assets/module-style.css"><style>.layout2{height:100vh;padding:12px;background:#f5f6f8}.card{height:100%;display:flex;flex-direction:column}.head{height:56px;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;padding:0 18px}.head h2{margin:0}.head .right{margin-left:auto;display:flex;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 40px}.block{padding:16px 20px;border-bottom:1px solid #eef2f6}.tablearea{flex:1;overflow:auto}.summary{height:68px;background:#101828;color:#fff;display:flex;align-items:center;gap:24px;padding:0 18px}.summary b{font-family:Consolas}.btn{height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 18px;cursor:pointer}.btn.primary{background:#1677ff;color:#fff}.btn.warn{background:#fff7ed;color:#c2410c}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px}</style></head><body><div class="layout2"><div class="card"><div class="head"><h2>采购订单 PO202606130001</h2><div class="right"><button class="btn">历史采购F4</button><button class="btn">保存草稿</button><button class="btn primary" onclick="toast('采购订单已审核，采购在途已生成')">审核</button></div></div><div class="block"><div class="grid4"><label class="field">供应商<input value="农夫山泉杭州经销"></label><label class="field">采购员<input value="李四"></label><label class="field">收货仓库<select><option>总仓</option></select></label><label class="field">单据日期<input value="2026-06-13"></label><label class="field">预计到货<input value="2026-06-18"></label><label class="field">结算方式<select><option>月结30天</option></select></label><label class="field">付款约定<input value="到货后30天付款"></label><label class="field">订单状态<select><option>草稿</option><option>待审核</option></select></label></div></div><div class="block"><div class="grid4"><label class="field" style="grid-column:1/3">商品/扫码<input id="goods" placeholder="输入商品编码/名称，回车添加" onkeydown="if(event.key==='Enter')addLine()"></label><label class="field"><button class="btn" onclick="openHistory()">常采商品</button></label><label class="field"><button class="btn" onclick="addGift()">添加赠品</button></label></div></div><div class="tablearea"><table class="matrix" style="width:1500px"><thead><tr><th>序号</th><th>商品编码</th><th>商品名称</th><th>单位</th><th>数量</th><th>采购单价</th><th>税率</th><th>金额</th><th>税额</th><th>成本单价</th><th>成本金额</th><th>已入库</th><th>行类型</th><th>备注</th><th>操作</th></tr></thead><tbody id="lines"></tbody></table></div><div class="summary"><span>商品金额 <b id="amt">¥0.00</b></span><span>税额 <b id="tax">¥0.00</b></span><span>费用分摊 <b>¥0.00</b></span><span>应付预估 <b id="final">¥0.00</b></span><span style="flex:1"></span><button class="btn">打印</button><button class="btn primary" onclick="toast('采购订单已提交审核')">提交审核</button></div></div></div><div id="toast" class="toast"></div><script>const ps=[['SP001','农夫山泉500ml*24','箱',100,35,13,31.2,'正常'],['SP002','康师傅红烧牛肉面','箱',50,48,13,42.5,'正常']];let i=0;function addLine(gift=false){let p=ps[i++%ps.length],qty=gift?10:p[3],price=gift?0:p[4],amount=qty*price,t=amount*p[5]/100,cost=qty*p[6];lines.insertAdjacentHTML('beforeend',`<tr><td>${lines.children.length+1}</td><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td contenteditable oninput="calc()">${qty}</td><td contenteditable oninput="calc()">${price.toFixed(2)}</td><td>${p[5]}%</td><td class="money">${amount.toFixed(2)}</td><td class="tax">${t.toFixed(2)}</td><td>${p[6].toFixed(4)}</td><td class="cost">${cost.toFixed(2)}</td><td>0</td><td>${gift?'赠品':'正常'}</td><td contenteditable></td><td><span class="link" onclick="this.closest('tr').remove();calc()">删除</span></td></tr>`);calc()}function addGift(){addLine(true)}function calc(){let a=[...document.querySelectorAll('.money')].reduce((s,e)=>s+(+e.textContent||0),0),t=[...document.querySelectorAll('.tax')].reduce((s,e)=>s+(+e.textContent||0),0);amt.textContent='¥'+a.toFixed(2);tax.textContent='¥'+t.toFixed(2);final.textContent='¥'+(a+t).toFixed(2)}function openHistory(){toast('已打开常采商品选择器')}function toast(m){let x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2000)}addLine();</script></body></html>
