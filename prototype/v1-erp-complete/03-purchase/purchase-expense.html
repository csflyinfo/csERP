<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>采购费用单原型</title><link rel="stylesheet" href="../assets/module-style.css"><style>.page{height:100vh;padding:12px;background:#f5f6f8}.card{height:100%;display:flex;flex-direction:column}.head{height:56px;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;padding:0 18px}.head h2{margin:0}.head .right{margin-left:auto;display:flex;gap:10px}.block{padding:16px 20px;border-bottom:1px solid #eef2f6}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 40px}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:8px;margin-top:10px}.content{flex:1;overflow:auto}.summary{height:68px;background:#101828;color:#fff;display:flex;align-items:center;gap:24px;padding:0 18px}.summary b{font-family:Consolas}.btn{height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 18px;cursor:pointer}.btn.primary{background:#1677ff;color:#fff}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px}</style></head><body><div class="page"><div class="card"><div class="head"><h2>采购费用单 PE202606130001</h2><div class="right"><button class="btn" onclick="preview()">分摊预览</button><button class="btn primary" onclick="toast('费用单已审核，成本已重算，应付已生成')">审核并重算成本</button></div></div><div class="block"><div class="grid4"><label class="field">费用类型<select><option>运费</option><option>装卸费</option></select></label><label class="field">收款对象类型<select><option>供应商</option><option>往来单位</option></select></label><label class="field">供应商<input value="顺丰物流"></label><label class="field">费用日期<input value="2026-06-13"></label><label class="field">费用金额<input id="fee" value="1000.00" oninput="preview()"></label><label class="field">税率<input value="9%"></label><label class="field">税额<input value="90.00"></label><label class="field">分摊方式<select id="mode" onchange="preview()"><option>按金额</option><option>按数量</option><option>按重量</option><option>手工</option></select></label></div><div class="warn">审核后将重算采购入库成本，可能影响后续出库成本和毛利。</div></div><div class="content"><div class="sec">费用明细</div><table class="matrix"><tr><th>费用项目</th><th>费用类型</th><th>数量</th><th>单价</th><th>金额</th><th>税率</th><th>税额</th><th>备注</th></tr><tr><td>杭州至仓库运费</td><td>运费</td><td>1</td><td>1000.00</td><td>1000.00</td><td>9%</td><td>90.00</td><td></td></tr></table><div class="sec">分摊对象</div><table class="matrix"><tr><th>选择</th><th>采购入库单</th><th>供应商</th><th>入库金额</th><th>入库数量</th><th>重量</th></tr><tr><td>☑</td><td>PI202606130001</td><td>农夫山泉杭州经销</td><td>10000</td><td>100</td><td>500kg</td></tr><tr><td>☑</td><td>PI202606130002</td><td>康师傅食品</td><td>20000</td><td>200</td><td>800kg</td></tr></table><div class="sec">分摊预览</div><div id="alloc"></div></div><div class="summary"><span>费用金额 <b id="feeSum">¥1000.00</b></span><span>已分摊 <b id="allocSum">¥1000.00</b></span><span>未分摊 <b>¥0.00</b></span><span style="flex:1"></span><button class="btn primary" onclick="toast('费用单已审核，成本已重算')">审核</button></div></div></div><div id="toast" class="toast"></div><script>function preview(){let f=+fee.value||0,a=f/3,b=f-a;feeSum.textContent='¥'+f.toFixed(2);allocSum.textContent='¥'+f.toFixed(2);alloc.innerHTML=`<table class="matrix"><tr><th>入库单</th><th>分摊基数</th><th>比例</th><th>分摊金额</th><th>分摊后成本金额</th><th>分摊后成本单价</th></tr><tr><td>PI202606130001</td><td>10000</td><td>33.33%</td><td>${a.toFixed(2)}</td><td>${(10000+a).toFixed(2)}</td><td>103.3333</td></tr><tr><td>PI202606130002</td><td>20000</td><td>66.67%</td><td>${b.toFixed(2)}</td><td>${(20000+b).toFixed(2)}</td><td>103.3334</td></tr></table>`}function toast(m){let x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2000)}preview();</script></body></html>
