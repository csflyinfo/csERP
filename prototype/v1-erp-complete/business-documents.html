let cur=new URLSearchParams(location.search).get('m') || 'purchaseOrder';function renderSide(){let html='';let groups={};Object.entries(mods).forEach(([k,v])=>(groups[v.group]??=[]).push([k,v.name]));Object.entries(groups).forEach(([g,items])=>{html+=`<h3>${g}</h3>`+items.map(i=>`<div class="nav ${i[0]===cur?'on':''}" onclick="cur='${i[0]}';render()">${i[1]}</div>`).join('')});side.innerHTML=html}function render(){let m=mods[cur];title.textContent=m.name;desc.textContent=m.desc;renderSide();list.innerHTML=`<div class="kpis"><div class="kpi"><div class="l">待审核</div><div class="v">12</div></div><div class="kpi"><div class="l">本月金额</div><div class="v">¥82,450</div></div><div class="kpi"><div class="l">异常/逾期</div><div class="v">3</div></div><div class="kpi"><div class="l">已完成</div><div class="v">86</div></div></div><div class="filter">${m.filters.map(f=>`<div class="fi"><label>${f}</label><input placeholder="${f}"></div>`).join('')}<button class="btn primary">查询</button><button class="btn">重置</button></div><div class="tablebox"><div class="toolbar"><b>${m.name}列表</b><div class="spacer"></div><button class="btn" onclick="showToast('已导出主单')">导出主单</button><button class="btn" onclick="showToast('已导出明细')">导出明细</button></div><div class="scroll"><table><tr>${m.cols.map(c=>`<th>${c}</th>`).join('')}<th>操作</th></tr><tr>${m.row.map((x,i)=>`<td class="${/金额|数量|成本|税额|应收|应付|已收|未收|已付|未付/.test(m.cols[i])?'num':''}">${x}</td>`).join('')}<td><span class="link" onclick="showEdit('edit')">编辑</span><span class="link" onclick="showToast('已审核')">审核</span></td></tr></table></div><div class="sum"><span>当前页合计：数量 <b>100</b></span><span>金额 <b>¥1,000.00</b></span></div></div>`;edit.classList.remove('on');list.classList.remove('off')}function showEdit(mode){let m=mods[cur];list.classList.add('off');edit.classList.add('on');edit.innerHTML=`<div class="form-card"><div class="form-head"><b>${mode==='new'?'新建':'编辑'} - ${m.name}</b><div class="spacer"></div><button class="btn" onclick="backList()">返回列表</button><button class="btn">保存草稿</button><button class="btn primary" onclick="showToast('${m.audit}')">提交/审核</button></div><div class="form-body"><div class="section"><h3>单据头</h3><div class="grid4">${m.fields.map(f=>`<div class="field"><label>${f}</label><input value="${f.includes('日期')?'2026-06-13':''}" placeholder="${f}"></div>`).join('')}</div></div><div class="section"><h3>明细信息</h3><div class="detail"><table><tr>${m.details.map(c=>`<th>${c}</th>`).join('')}<th>操作</th></tr><tr>${m.details.map((c,i)=>`<td contenteditable class="${/金额|数量|成本|单价|税率|库存/.test(c)?'num':''}">${i===0?'示例商品':''}</td>`).join('')}<td><span class="link" onclick="this.closest('tr').remove()">删除</span></td></tr></table></div><br><button class="btn" onclick="showToast('已新增明细行')">新增明细行</button></div></div><div class="summary"><span>数量 <b>100</b></span><span>金额 <b>¥1,000.00</b></span><span>成本 <b>¥800.00</b></span><div style="flex:1"></div><button class="btn primary" onclick="showToast('${m.audit}')">审核</button></div></div>`}function newBill(){showEdit('new')}function backList(){edit.classList.remove('on');list.classList.remove('off')}function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}render();
</script></body></html>
