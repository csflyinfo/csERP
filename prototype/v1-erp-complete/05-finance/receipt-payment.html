<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>收款付款单原型</title><link rel="stylesheet" href="../assets/module-style.css"><style>.page{height:100vh;padding:12px;background:#f5f6f8}.card{height:100%;display:flex;flex-direction:column}.head{height:56px;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;padding:0 18px}.tabs{height:48px;border-bottom:1px solid #e5eaf2;display:flex;gap:30px;padding:0 20px}.tabs span{line-height:48px;cursor:pointer}.tabs .on{color:#1677ff;border-bottom:2px solid #1677ff}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 40px}.block{padding:16px 20px;border-bottom:1px solid #eef2f6}.content{flex:1;overflow:auto}.btn{height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 18px}.btn.primary{background:#1677ff;color:#fff}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px}</style></head><body><div class="page"><div class="card"><div class="head"><h2 id="title">收款单 RC202606130001</h2><div style="margin-left:auto"><button class="btn">保存草稿</button><button class="btn primary" onclick="audit()">审核</button></div></div><div class="tabs"><span class="on" onclick="switchMode('receipt')">收款单</span><span onclick="switchMode('payment')">付款单</span></div><div class="block"><div class="grid4" id="form"></div></div><div class="content"><div class="sec" id="detailTitle">待核销应收</div><div id="detail"></div></div><div class="summary"><span id="sum1">收款金额 <b>¥800.00</b></span><span id="sum2">已核销 <b>¥800.00</b></span><span id="sum3">未核销 <b>¥0.00</b></span></div></div></div><div id="toast" class="toast"></div><script>let mode='receipt';function switchMode(m){mode=m;document.querySelectorAll('.tabs span').forEach((x,i)=>x.classList.toggle('on',i==(m==='receipt'?0:1)));render()}function render(){if(mode==='receipt'){title.textContent='收款单 RC202606130001';form.innerHTML=`<label class="field">对象类型<select><option>客户</option><option>往来单位</option></select></label><label class="field">客户/往来单位<input value="华联超市"></label><label class="field">收款类型<select><option>销售收款</option><option>预收款</option><option>其他收入</option></select></label><label class="field">收款方式<select><option>银行转账</option><option>现金</option><option>微信</option></select></label><label class="field">资金账户<select><option>工行基本户</option></select></label><label class="field">收款金额<input value="800.00"></label><label class="field">收款日期<input value="2026-06-13"></label><label class="field">附件<button class="btn">上传凭证</button></label>`;detailTitle.textContent='待核销应收';detail.innerHTML=`<table class="matrix"><tr><th>选择</th><th>应收单号</th><th>来源单据</th><th>应收金额</th><th>未收金额</th><th>本次核销</th></tr><tr><td>☑</td><td>AR001</td><td>SR001</td><td>1000.00</td><td>800.00</td><td contenteditable>800.00</td></tr></table>`;sum1.innerHTML='收款金额 <b>¥800.00</b>';sum2.innerHTML='已核销 <b>¥800.00</b>';sum3.innerHTML='未核销 <b>¥0.00</b>'}else{title.textContent='付款单 FK202606130001';form.innerHTML=`<label class="field">对象类型<select><option>供应商</option><option>往来单位</option></select></label><label class="field">供应商/往来单位<input value="农夫山泉杭州经销"></label><label class="field">付款类型<select><option>采购付款</option><option>预付款</option><option>费用付款</option></select></label><label class="field">付款方式<select><option>银行转账</option><option>现金</option></select></label><label class="field">资金账户<select><option>工行基本户 余额¥50,000</option></select></label><label class="field">供应商收款账户<select><option>默认账户-工商银行 6222****0000</option><option>备用账户-建设银行 6227****0000</option></select></label><label class="field">付款金额<input value="1000.00"></label><label class="field">付款日期<input value="2026-06-13"></label>`;detailTitle.textContent='待核销应付';detail.innerHTML=`<table class="matrix"><tr><th>选择</th><th>应付单号</th><th>来源单据</th><th>应付金额</th><th>未付金额</th><th>本次核销</th></tr><tr><td>☑</td><td>AP001</td><td>PR001</td><td>3500.00</td><td>3500.00</td><td contenteditable>1000.00</td></tr></table>`;sum1.innerHTML='付款金额 <b>¥1000.00</b>';sum2.innerHTML='已核销 <b>¥1000.00</b>';sum3.innerHTML='未核销 <b>¥0.00</b>'}}function audit(){toast.textContent=mode==='receipt'?'收款单已审核，资金增加并完成核销':'付款单已审核，资金减少并完成核销';toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)}render();</script></body></html>
