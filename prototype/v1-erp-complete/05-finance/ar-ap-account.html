<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>应收应付账款合并原型</title><link rel="stylesheet" href="../assets/module-style.css"><style>.page{height:100vh;padding:12px;background:#f5f6f8}.card{height:100%;display:flex;flex-direction:column}.head{height:56px;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;padding:0 18px}.head h2{margin:0}.tabs{height:50px;border-bottom:1px solid #e5eaf2;display:flex;gap:30px;padding:0 20px}.tabs span{line-height:50px;cursor:pointer}.tabs .on{color:#1677ff;border-bottom:2px solid #1677ff}.query{display:flex;gap:10px;padding:14px;border-bottom:1px solid #eef2f6}.query input,.query select{height:36px;border:1px solid #dbe3ef;border-radius:5px;padding:0 12px}.content{flex:1;overflow:auto}.settle{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px}.sidecard{border:1px solid #e5eaf2;border-radius:8px;padding:16px;background:#fff}.btn{height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 18px}.btn.primary{background:#1677ff;color:#fff}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px}</style></head><body><div class="page"><div class="card"><div class="head"><h2 id="title">应收账款</h2><div style="margin-left:auto"><button class="btn" onclick="mode='ar';render()">应收</button><button class="btn" onclick="mode='ap';render()">应付</button></div></div><div class="tabs"><span class="on">明细/结算</span><span>预收/预付</span><span>收付款记录</span><span>账龄分析</span></div><div class="query"><input placeholder="对象/单号"><select><option>核销状态</option></select><select><option>逾期状态</option></select><button class="btn primary">查询</button></div><div class="settle"><div id="table"></div><aside class="sidecard"><h3 id="settleTitle">本次收款结算</h3><label class="field">资金账户<select><option>工行基本户</option></select></label><br><label class="field">本次金额<input id="money" value="800.00"></label><br><label class="field">预收/预付抵扣<input value="0.00"></label><br><label class="field">折让<input value="0.00"></label><br><button class="btn primary" style="width:100%" onclick="toast(mode==='ar'?'已生成收款单并核销':'已生成付款单并核销')">生成单据并核销</button></aside></div></div></div><div id="toast" class="toast"></div><script>let mode='ar';function render(){title.textContent=mode==='ar'?'应收账款':'应付账款';settleTitle.textContent=mode==='ar'?'本次收款结算':'本次付款结算';let rows=mode==='ar'?[['AR001','华联超市','SR001','1000','200','800','2026-07-13','未核销'],['AR002','万科物业','FE001','500','0','500','2026-06-30','未核销']]:[['AP001','农夫山泉杭州经销','PR001','3500','0','3500','2026-07-13','未核销'],['AP002','顺丰物流','FE002','3200','0','3200','2026-06-30','未核销']];table.innerHTML=`<table class="matrix"><tr><th>选择</th><th>单号</th><th>对象</th><th>来源</th><th>金额</th><th>已结</th><th>未结</th><th>预计日期</th><th>状态</th></tr>${rows.map(r=>`<tr><td>☑</td>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`}function toast(m){toast.textContent=m;toast.style.display='block';setTimeout(()=>toast.style.display='none',2000)}render();</script></body></html>
