<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>销售快速开单原型</title><link rel="stylesheet" href="../assets/module-style.css"><style>
body{background:#f5f6f8}.page{height:100vh;padding:12px}.main-card{height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid #e5eaf2;border-radius:8px;box-shadow:0 8px 22px rgba(16,24,40,.06)}.head{height:56px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #e5eaf2}.head h2{margin:0}.head .right{margin-left:auto;display:flex;gap:10px}.block{padding:14px 18px;border-bottom:1px solid #eef2f6}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 36px}.grid5{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{height:38px;border:1px solid #dbe3ef;border-radius:5px;padding:0 12px;width:100%}.risk{margin-top:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:10px;font-weight:700}.risk.bad{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.table-wrap{flex:1;overflow:auto}.detail{width:1600px;border-collapse:collapse}.detail th,.detail td{height:46px;border-right:1px solid #e5eaf2;border-bottom:1px solid #edf1f5;text-align:center;padding:0 10px}.detail th{background:#f7f8fa;position:sticky;top:0}.detail input,.detail select{height:32px;border:1px solid #dbe3ef;border-radius:4px;padding:0 8px;width:100%}.num{text-align:right;font-family:Consolas,monospace}.summary{height:72px;background:#101828;color:#fff;display:flex;align-items:center;gap:24px;padding:0 18px;border-radius:0 0 8px 8px}.summary b{font-family:Consolas,monospace}.summary .spacer{flex:1}.btn{height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 18px;cursor:pointer}.btn.primary{background:#1677ff;color:#fff;border-color:#1677ff}.btn.warn{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.btn.danger{background:#fff;color:#d92d20;border-color:#fecaca}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;border-radius:8px;padding:12px 16px;z-index:50}.toast.show{display:block}.modalMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center}.modalMask.show{display:flex}.modal{background:#fff;border-radius:6px;box-shadow:0 20px 80px rgba(0,0,0,.25);width:780px;max-height:80vh;overflow:auto}.mh{height:54px;border-bottom:1px solid #e5eaf2;padding:0 20px;display:flex;align-items:center;font-size:20px;font-weight:700}.mb{padding:18px}.quick-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{border:1px solid #e5eaf2;border-radius:8px;padding:12px;display:flex;justify-content:space-between}.kbd{font-family:Consolas,monospace;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:5px;padding:2px 5px}</style></head><body><div class="page"><div class="main-card"><div class="head"><h2>销售快速开单</h2><div class="right"><button class="btn" onclick="openHelp()">快捷键帮助</button><button class="btn primary" onclick="audit()">审核并打印 Ctrl+Enter</button></div></div><div class="block"><div class="grid4"><div class="field"><label>客户 F2</label><input id="customer" value="华联超市" onfocus="this.select()"></div><div class="field"><label>仓库</label><select><option>总仓</option><option>东区仓</option></select></div><div class="field"><label>业务员</label><select><option>张三</option></select></div><div class="field"><label>结算方式</label><select><option>月结30天</option><option>现结</option></select></div></div><div class="risk" id="risk">欠款 ¥12,000　逾期 ¥2,000　信用额度 ¥50,000　可用额度 ¥38,000</div></div><div class="block"><div class="grid5"><div class="field"><label>商品/扫码 F3</label><input id="goodsInput" placeholder="扫码/编码/名称/简拼，回车添加" onkeydown="if(event.key==='Enter')addLine()"></div><div class="field"><label>常购</label><button class="btn" onclick="openCommon()">常购F4</button></div><div class="field"><label>历史订单</label><button class="btn">复制历史</button></div><div class="field"><label>赠品</label><button class="btn" onclick="addGift()">添加赠品F7</button></div><div class="field"><label>重算</label><button class="btn" onclick="recalc()">重算F9</button></div></div></div><div class="table-wrap"><table class="detail"><thead><tr><th>序号</th><th>商品编码</th><th>商品名称</th><th>单位</th><th>数量</th><th>可用库存</th><th>单价</th><th>折扣</th><th>金额</th><th>成本单价</th><th>成本金额</th><th>毛利</th><th>价格来源</th><th>赠品</th><th>操作</th></tr></thead><tbody id="lines"></tbody></table></div><div class="summary"><span>商品金额 <b id="goodsAmt">¥0.00</b></span><span>优惠 <b id="discountAmt">¥0.00</b></span><span>应收 <b id="arAmt">¥0.00</b></span><span>已收 <b id="paidAmt">¥0.00</b></span><span>未收 <b id="unpaidAmt">¥0.00</b></span><span class="spacer"></span><button class="btn">挂单</button><button class="btn">保存草稿 F5</button><button class="btn primary" onclick="audit()">审核 F6</button></div></div></div><div id="mask" class="modalMask"></div><div id="toast" class="toast"></div><script>
const products=[['SP001','农夫山泉500ml*24','箱',35,120,31.2,'客户价'],['SP002','康师傅红烧牛肉面','箱',48,88,42.5,'等级价'],['SP003','统一冰红茶','箱',38,60,35,'标准价']];let idx=0;function addLine(gift=false){let p=products[idx++%products.length],qty=gift?1:10,price=gift?0:p[3],amt=qty*price,cost=qty*p[5];lines.insertAdjacentHTML('beforeend',`<tr><td>${lines.children.length+1}</td><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td><input class="num" value="${qty}" oninput="rowCalc(this)"></td><td>${p[4]}</td><td><input class="num" value="${price.toFixed(2)}" oninput="rowCalc(this)"></td><td><input class="num" value="0" oninput="rowCalc(this)"></td><td class="num amount">${amt.toFixed(2)}</td><td class="num costp">${p[5].toFixed(4)}</td><td class="num cost">${cost.toFixed(2)}</td><td class="num profit">${(amt-cost).toFixed(2)}</td><td>${p[6]}</td><td>${gift?'是':'否'}</td><td><span style="color:#1677ff;cursor:pointer" onclick="this.closest('tr').remove();recalc()">删除</span></td></tr>`);recalc();toast(gift?'已添加赠品行':'已添加商品行')}function addGift(){addLine(true)}function rowCalc(el){let tr=el.closest('tr'),qty=+tr.children[4].querySelector('input').value||0,price=+tr.children[6].querySelector('input').value||0,disc=+tr.children[7].querySelector('input').value||0,costp=+tr.querySelector('.costp').textContent;let amt=qty*price-disc,cost=qty*costp;tr.querySelector('.amount').textContent=amt.toFixed(2);tr.querySelector('.cost').textContent=cost.toFixed(2);tr.querySelector('.profit').textContent=(amt-cost).toFixed(2);recalc()}function recalc(){let total=[...document.querySelectorAll('.amount')].reduce((s,e)=>s+(+e.textContent||0),0);goodsAmt.textContent=arAmt.textContent=unpaidAmt.textContent='¥'+total.toFixed(2)}function audit(){toast('销售订单已审核，库存已锁定，已生成出库任务')}function openCommon(){mask.innerHTML=`<div class="modal"><div class="mh">客户常购商品</div><div class="mb"><div class="quick-list">${products.map(p=>`<div class="item"><span>${p[1]}<br><small>最近售价 ¥${p[3]}</small></span><button class="btn primary" onclick="addLine();mask.classList.remove('show')">添加</button></div>`).join('')}</div></div></div>`;mask.classList.add('show')}function openHelp(){mask.innerHTML=`<div class="modal"><div class="mh">快捷键帮助</div><div class="mb"><p><span class="kbd">F2</span> 聚焦客户　<span class="kbd">F3</span> 聚焦商品　<span class="kbd">F7</span> 添加赠品　<span class="kbd">F9</span> 重算金额　<span class="kbd">Ctrl+Enter</span> 审核</p></div></div>`;mask.classList.add('show')}document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();customer.focus()}if(e.key==='F3'){e.preventDefault();goodsInput.focus()}if(e.key==='F7'){e.preventDefault();addGift()}if(e.key==='F9'){e.preventDefault();recalc();toast('已重算金额')}if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();audit()}});mask.onclick=e=>{if(e.target===mask)mask.classList.remove('show')};function toast(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}addLine();</script></body></html>
