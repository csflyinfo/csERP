let activeTop='首页',current='dashboard';function init(){renderMenu();route('dashboard')}function renderMenu(){let html='<div class="side-search"><input class="quick-search" id="quickSearch" placeholder="模块快捷搜索：客户、商品、供应商、单据号" onkeydown="if(event.key===\'Enter\')quickLocate(this.value)"></div>';Object.keys(nav).forEach(top=>{let open=top===activeTop;html+=`<div class="lvl1-item ${open?'on':''}" onclick="activeTop='${top}';current=nav['${top}'][0][0];renderMenu();route(current)"><span class="dot"></span>${top}</div>`;if(open)html+=`<div class="submenu">${nav[top].map(i=>`<div class="lvl2-item ${i[0]===current?'on':''}" onclick="event.stopPropagation();route('${i[0]}')">${i[1]}</div>`).join('')}</div>`});side.innerHTML=html}function quickLocate(q){let hit;Object.values(nav).flat().some(i=>{if(i[1].includes(q)){hit=i[0];return true}});hit?route(hit):toast('未找到匹配模块')}function route(id){current=id;content.style.padding='';Object.keys(nav).forEach(t=>{if(nav[t].some(i=>i[0]===id))activeTop=t});renderMenu();if(id==='dashboard')return dashboard();if(id==='quick')return quick();if(id==='init')return initPage();if(id==='customerPriceQuery')return customerPriceQuery();if(tmsPages[id])return openTms(id);if(masters[id])return master(id);if(bill[id])return billList(id)}const tmsPages={dispatchPool:'07-tms/dispatch-pool.html',dispatchSchedule:'07-tms/dispatch-schedule.html',dispatchList:'07-tms/dispatch-list.html',deliveryMonitor:'07-tms/delivery-monitor.html',rescheduleReturn:'07-tms/reschedule-return.html',customerReject:'07-tms/customer-reject.html',settlement:'07-tms/settlement.html',dispatchDashboard:'07-tms/dispatch-dashboard.html',salesReturn:'02-sales/sales-return.html'};const tmsTitles={dispatchPool:['配送任务池','待调度发货单池，按片区/线路筛选，生成调度单'],dispatchSchedule:['排线调度','发货单池 × 车辆司机池 × 配送顺序调整'],dispatchList:['调度单列表','调度单查询、详情、在途跟踪'],deliveryMonitor:['在途监控','车辆实时位置与门店配送进度'],rescheduleReturn:['改派返仓','客户不在/地址错误等验收后回调度池重新派送'],customerReject:['客户拒收单','客户拒收商品仓库收货生成拒收入库单'],settlement:['交账管理',' function customerPriceEdit(mode='new'){title.textContent=(mode==='new'?'新建':'编辑')+' - 客户价格调整单';desc.textContent='先选客户与生效规则，再添加调价商品；审核后才确认，最新调价自动覆盖旧价';content.innerHTML=`<div class="form-card"><div class="form-head"><b>${title.textContent}</b><span class="badge wait" style="margin-left:10px">待审核</span><div class="spacer"></div><button class="btn" onclick="master('customerPrice')">返回列表</button><button class="btn" onclick="toast('已保存，返回调整单列表')">保存</button><button class="btn primary" onclick="openConfirm('审核客户价格调整单','审核后生成客户有效价格；同客户同商品旧价格将自动停用。','确认审核')">审核</button></div><div class="form-body"><div class="section"><h3>调价信息</h3>${fieldGrid(['客户','生效方式','生效时间点','价格有效范围','备注'])}</div><div class="section"><h3>调价商品明细</h3><div class="detail-actions"><button class="btn primary" onclick="toast('可在表格直接录入商品编号/条码')">表格录入商品</button><button class="btn" onclick="openGoodsPicker()">从商品档案添加</button><button class="btn" onclick="toast('导入字段：门店编号、商品编号、现价')">导入商品</button></div>${matrix(['商品编号','名称','基本单位','规格','条码','原价','现价','最新进价','成本价','操作'],[['SP001','农夫山泉500ml*24','瓶','500ml*24','6941410749551','35.00','34.50','31.20','30.80','删除'],['SP002','康师傅红烧牛肉面','箱','1*12','690000000002','48.00','46.80','42.50','41.90','删除']])}</div><div class="risk">规则：原价取客户价格组默认价格，无则取标准价；现价可编辑；审核前可修改，审核后不可改价。</div></div><div class="sticky-actionbar"><span>调价商品 <b>2</b></span><span>生效方式 <b>定时生效</b></span><span>有效范围 <b>2026-06-15 ~ 2026-12-31</b></span><div style="flex:1"></div><button class="btn" onclick="toast('已保存草稿')">保存</button><button class="btn primary" onclick="openConfirm('审核客户价格调整单','审核后该客户商品价格正式生效，历史有效价自动停用。','确认审核')">审核</button></div></div>`}
function customerPriceQuery(){title.textContent='客户价格查询';desc.textContent='查询客户价格调整单及明细，可按门店、商品、生效状态筛选并停用价格';content.innerHTML=`${filter(['门店/客户','商品','生效状态','单号','有效日期'])}<div style="text-align:right;margin-bottom:8px"><button class="btn danger" onclick="openConfirm('停用客户价格','停用后该客户商品价格不再参与销售开单匹配，请填写停用原因。','确认停用')">停用所选价格</button><button class="btn">导出</button></div><div class="tablebox"><div class="toolbar"><b>客户价格明细</b><div class="spacer"></div><span class="mini-note">最新调价自动覆盖前价，前价自动停用</span></div><div class="scroll"><table><tr>${['选择','单号','客户编号/名称','单据日期','生效方式','有效范围','商品编号','名称','基本单位','规格','条码','原价','现价','最新进价','成本价','生效状态','操作'].map(c=>`<th>${c}</th>`).join('')}</tr><tr>${['□','CPA202606140001','C001 华联超市','2026-06-14','定时生效','2026-06-15 ~ 2026-12-31','SP001','农夫山泉500ml*24','瓶','500ml*24','6941410749551','35.00','34.50','31.20','30.80','待生效','查看来源 停用'].map((x,i)=>`<td class="${i>=11&&i<=14?'num':''}">${x}</td>`).join('')}</tr><tr>${['□','CPA202606010003','C002 城西便利','2026-06-01','立即生效','长期有效','SP002','康师傅红烧牛肉面','箱','1*12','690000000002','48.00','46.80','42.50','41.90','生效中','查看来源 停用'].map((x,i)=>`<td class="${i>=11&&i<=14?'num':''}">${x}</td>`).join('')}</tr></table></div><div class="sum"><span>当前客户价记录 <b>2</b></span><span>可停用 <b>2</b></span></div></div>`}
function openGoodsPicker(){document.body.insertAdjacentHTML('beforeend',`<div class="modal show"><div class="modalbox"><div class="modalhead">从商品档案添加</div><div class="modalbody">${filter(['商品关键字','商品分类','品牌','状态'])}${matrix(['选择','商品编号','商品名称','基本单位','规格','条码','标准价'],[['□','SP001','农夫山泉500ml*24','瓶','500ml*24','6941410749551','35.00'],['□','SP002','康师傅红烧牛肉面','箱','1*12','690000000002','48.00']])}</div><div class="modalfoot"><button class="btn" onclick="this.closest('.modal').remove()">取消</button><button class="btn primary" onclick="this.closest('.modal').remove();toast('已加入调价明细')">加入明细</button></div></div></div>`)}
function openConfirm(t,msg,ok){document.body.insertAdjacentHTML('beforeend',`<div class="modal show"><div class="modalbox confirm"><div class="modalhead">${t}</div><div class="modalbody"><div class="risk">${msg}</div><div class="field"><label class="required">原因/备注</label><textarea placeholder="请输入审核、驳回、作废或反审核原因"></textarea></div></div><div class="modalfoot"><button class="btn" onclick="this.closest('.modal').remove()">取消</button><button class="btn primary" onclick="this.closest('.modal').remove();toast('${ok}成功')">${ok}</button></div></div></div>`)}
renderMenu();
// ===== END_FINAL_TREE_SCOPE_FIX =====
init();
</script></body></html>
