<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V1.0 ERP系统原型集成展示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#1f2937;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.top{height:52px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;padding:0 18px;gap:14px}.logo{font-weight:900;font-size:18px}.muted{color:#667085}.layout{height:calc(100vh - 52px);display:grid;grid-template-columns:260px 1fr}.side{background:linear-gradient(180deg,#eaf4ff 0%,#f8fbff 100%);color:#24415f;padding:14px;overflow:auto}.side h3{color:#12385f;margin:8px 0 14px}.nav{height:38px;border-radius:8px;display:flex;align-items:center;padding:0 10px;cursor:pointer;margin:4px 0}.nav:hover,.nav.on{background:#2563eb;color:#fff}.main{padding:14px;overflow:auto}.hero{background:#fff;border:1px solid #dbe3ef;border-radius:12px;padding:16px;margin-bottom:14px;display:flex;align-items:center}.hero h1{margin:0;font-size:22px}.hero .actions{margin-left:auto;display:flex;gap:10px}.btn{height:36px;border:1px solid #dbe3ef;background:#fff;border-radius:8px;padding:0 14px;cursor:pointer}.btn.primary{background:#1677ff;color:#fff;border-color:#1677ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{background:#fff;border:1px solid #dbe3ef;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(16,24,40,.06);min-height:380px;display:flex;flex-direction:column}.tile-head{height:48px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #e5eaf2}.tile-title{font-weight:800}.tile-desc{font-size:12px;color:#667085;margin-left:12px}.tile-actions{margin-left:auto;display:flex;gap:8px}.frame-wrap{flex:1;background:#f8fafc}.frame-wrap iframe{width:100%;height:520px;border:0;display:block;background:#fff}.full .grid{grid-template-columns:1fr}.full .tile .frame-wrap iframe{height:calc(100vh - 190px)}.badge{font-size:12px;border-radius:999px;background:#eaf2ff;color:#1677ff;padding:3px 8px;margin-left:8px}.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:12px;margin-bottom:14px}</style>
</head>
<body>
<div class="top"><div class="logo">商贸云 ERP V1.0 原型集成展示</div><div class="muted">按整体分格展示各复杂模块专属原型</div></div>
<div class="layout"><aside class="side"><h3>模块导航</h3><div class="nav on" onclick="showAll(this)">整体分格展示</div><div class="nav" onclick="focusTile(this,'product')">商品档案</div><div class="nav" onclick="focusTile(this,'customer')">门店/客户资料</div><div class="nav" onclick="focusTile(this,'supplier')">供应商资料</div><div class="nav" onclick="focusTile(this,'system')">完整后台总览</div><h3>说明</h3><p style="font-size:13px;line-height:1.7;color:#5b7a99">每个模块是独立可操作原型，通过 iframe 合并到系统展示页。点击“全屏查看”可进入单模块原型。</p></aside><main class="main" id="main"><div class="hero"><div><h1>V1.0 核心模块原型</h1><div class="muted">商品、门店、供应商等复杂模块采用专属高保真原型；系统总览保留全模块菜单。</div></div><div class="actions"><button class="btn" onclick="toggleFull()">切换单列/双列</button><button class="btn primary" onclick="location.href='modules.html'">模块入口</button></div></div><div class="note">提示：如果浏览器安全策略限制 iframe，本页可点击每个模块右侧“全屏查看”打开独立原型。</div><section class="grid" id="grid"></section></main></div>
<script>
const tiles=[['product','商品档案','商品分类树、商品列表、单页锚点编辑、单位/价格矩阵','product-archive.html'],['customer','门店/客户资料','客户分类树、灵活账期设置、地址、开票、导入修改','customer-archive.html'],['supplier','供应商资料','供应商分类树、灵活账期设置、多个收款账户、付款账户选择','supplier-archive.html'],['system','完整后台总览','V1.0全模块菜单、通用网格、新建编辑审核交互','index.html']];
function tile(id,title,desc,url){return `<article class="tile" id="${id}"><div class="tile-head"><span class="tile-title">${title}</span><span class="badge">可操作</span><span class="tile-desc">${desc}</span><div class="tile-actions"><button class="btn" onclick="reloadFrame('${id}')">刷新</button><button class="btn primary" onclick="location.href='${url}'">全屏查看</button></div></div><div class="frame-wrap"><iframe src="${url}" data-url="${url}"></iframe></div></article>`}
document.getElementById('grid').innerHTML=tiles.map(t=>tile(...t)).join('');
function reloadFrame(id){const f=document.querySelector('#'+id+' iframe');f.src=f.dataset.url}
function toggleFull(){document.getElementById('main').classList.toggle('full')}
function focusTile(el,id){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('on'));el.classList.add('on');document.getElementById('main').classList.add('full');document.querySelectorAll('.tile').forEach(t=>t.style.display=t.id===id?'flex':'none')}
function showAll(el){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('on'));el.classList.add('on');document.getElementById('main').classList.remove('full');document.querySelectorAll('.tile').forEach(t=>t.style.display='flex')}
</script>
</body>
</html>
