<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMS PDA 作业终端 - 原型</title>
<style>
:root{
  --bg:#0b1220; --card:#141c2e; --card2:#1b2538; --line:#243049; --line2:#2d3a55;
  --txt:#e8eefc; --txt2:#9fb0d0; --txt3:#6b7a99;
  --pri:#2f7bff; --pri-d:#1c5fd0; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --pur:#a855f7; --info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"思源黑体","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;background:#070b14;color:var(--txt);min-height:100vh;display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:24px}
.desc{width:100%;text-align:center;color:#9fb0d0;max-width:900px;margin:0 auto 4px}
.desc h1{font-size:20px;color:#fff;margin-bottom:6px}
.desc p{font-size:13px;line-height:1.7}
.phone{width:390px;height:820px;background:var(--bg);border-radius:42px;border:10px solid #050810;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 2px #1a2438;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#050810;border-radius:0 0 18px 18px;z-index:50}
.statusbar{height:38px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-size:12px;color:var(--txt2);flex:0 0 auto}
.statusbar .right b{color:var(--txt);font-weight:600}
.appbar{flex:0 0 auto;padding:8px 16px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#111a2e,#0b1220)}
.appbar .back{width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:1px solid var(--line2)}
.appbar h2{font-size:17px;font-weight:700;flex:1}
.appbar .act{font-size:12px;color:var(--pri);cursor:pointer}
.screen{flex:1;overflow-y:auto;padding:12px 14px 90px;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(14,21,38,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:8px;z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--txt3);cursor:pointer}
.tab .ic{font-size:21px}
.tab.on{color:var(--pri)}
.tab.scan .ic{width:46px;height:46px;background:linear-gradient(145deg,var(--pri),var(--pri-d));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin-top:-20px;box-shadow:0 6px 18px rgba(47,123,255,.5);color:#fff;border:3px solid var(--bg)}

/* home */
.hello{padding:6px 4px 14px}
.hello .who{font-size:20px;font-weight:800}
.hello .who small{font-size:12px;color:var(--txt2);font-weight:400;margin-left:8px}
.hello .sub{font-size:12px;color:var(--txt3);margin-top:3px}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:8px;color:var(--txt3);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-bottom:16px}
.gi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative;transition:transform .1s}
.gi:active{transform:scale(.94)}
.gi .ic{font-size:25px}
.gi .nm{font-size:12px;text-align:center;line-height:1.2;color:var(--txt)}
.gi .badge{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;font-weight:700;min-width:18px;text-align:center}
.sect-t{font-size:13px;color:var(--txt2);font-weight:700;margin:6px 2px 10px;display:flex;align-items:center;gap:6px}
.sect-t b{color:var(--txt)}
.quick{background:linear-gradient(135deg,#16223d,#101a30);border:1px solid var(--line2);border-radius:16px;padding:14px;margin-bottom:14px}
.quick h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.taskrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.taskrow:first-of-type{border-top:none}
.taskrow .ti{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.taskrow .tm{flex:1;min-width:0}
.taskrow .tm .t1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskrow .tm .t2{font-size:11px;color:var(--txt3);margin-top:2px}
.taskrow .go{color:var(--pri);font-size:12px;font-weight:600}

/* generic */
.scan{background:linear-gradient(135deg,rgba(47,123,255,.16),rgba(47,123,255,.04));border:1.5px dashed var(--pri);border-radius:18px;padding:24px 16px;text-align:center;margin-bottom:14px;cursor:pointer}
.scan .ic{font-size:46px;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 10px rgba(47,123,255,.4))}
.scan .b{font-size:16px;font-weight:700}
.scan .s{font-size:12px;color:var(--txt2);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.card h4{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--txt2)}
.kv .v{font-weight:600;text-align:right}
.kv .v.red{color:var(--bad)} .kv .v.ok{color:var(--ok)} .kv .v.warn{color:var(--warn)} .kv .v.pur{color:var(--pur)}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px}
.rowline:last-child{border-bottom:none}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.t-ok{background:rgba(34,197,94,.15);color:var(--ok)} .t-wait{background:rgba(245,158,11,.16);color:var(--warn)}
.t-bad{background:rgba(239,68,68,.15);color:var(--bad)} .t-info{background:rgba(56,189,248,.15);color:var(--info)}
.t-pur{background:rgba(168,85,247,.15);color:var(--pur)} .t-gray{background:rgba(155,170,196,.14);color:var(--txt2)}
.btn{display:block;width:100%;padding:13px;border-radius:13px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;background:var(--card2);color:var(--txt);border:1px solid var(--line2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(145deg,var(--pri),var(--pri-d));color:#fff;border:none;box-shadow:0 6px 16px rgba(47,123,255,.4)}
.btn.ok{background:linear-gradient(145deg,#22c55e,#16a34a);color:#fff;border:none}
.btn.bad{background:linear-gradient(145deg,#ef4444,#dc2626);color:#fff;border:none}
.btn.warn{background:linear-gradient(145deg,#f59e0b,#d97706);color:#fff;border:none}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt2)}
.btnrow{display:flex;gap:8px} .btnrow .btn{margin-top:10px}
.stepper{display:flex;align-items:center;justify-content:flex-end;gap:0}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);font-size:18px;font-weight:700}
.stepper input{width:54px;height:34px;text-align:center;background:var(--bg);border:1px solid var(--line2);border-radius:9px;color:var(--txt);font-size:15px;font-weight:700;margin:0 6px}
.prog{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--info));border-radius:6px}
.dots{display:flex;gap:6px;margin:10px 0}
.dots .d{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.dots .d.on{background:var(--pri)}
.dots .d.done{background:var(--ok)}
.flowstep{display:flex;gap:10px;position:relative;padding-bottom:16px}
.flowstep:before{content:'';position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line2)}
.flowstep:last-child:before{display:none}
.flowstep .n{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--card2);border:2px solid var(--line2);color:var(--txt2);z-index:1}
.flowstep.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.flowstep.cur .n{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 4px rgba(47,123,255,.2)}
.flowstep .c .t1{font-size:13px;font-weight:600}
.flowstep .c .t2{font-size:11px;color:var(--txt3);margin-top:2px}
.alert{padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.6;margin-bottom:12px}
.alert.tip{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#bae6fd}
.alert.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#bbf7d0}
.alert.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#fde68a}
.alert.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fecaca}
.mini-t{width:100%;border-collapse:collapse;font-size:12.5px}
.mini-t th{text-align:left;color:var(--txt3);font-weight:500;padding:7px 6px;border-bottom:1px solid var(--line)}
.mini-t td{padding:9px 6px;border-bottom:1px solid var(--line)}
.mini-t .num{text-align:right;font-variant-numeric:tabular-nums}
.mini-t .red{color:var(--bad)} .mini-t .ok{color:var(--ok)} .mini-t .warn{color:var(--warn)}
.muted{color:var(--txt3)}
.bin{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:100%;aspect-ratio:1;background:var(--card2);border:1px solid var(--line2);border-radius:10px;font-size:10px;color:var(--txt2);padding:4px}
.bin b{font-size:11px;color:var(--txt)}
.path-stop{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.path-stop .n{width:24px;height:24px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}
.path-stop.cur .n{background:var(--pri);color:#fff}
.path-stop.done .n{background:var(--ok);color:#fff}
.path-stop .arrow{margin-left:auto;color:var(--txt3)}
.note{font-size:11px;color:var(--txt3);line-height:1.6;margin-top:8px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0}
label.chk input{width:18px;height:18px;accent-color:var(--pri)}
.hometabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.hometabs .ht{flex:0 0 auto;padding:7px 14px;background:var(--card);border:1px solid var(--line);border-radius:20px;font-size:12.5px;color:var(--txt2);cursor:pointer}
.hometabs .ht.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* pick: 任务卡 / 当前商品大卡 / 分播 */
.task-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.task-card.help{border-color:rgba(34,197,94,.4)}
.task-card .tc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.task-card .zn{font-size:11px;font-weight:800;color:#fff;padding:2px 9px;border-radius:6px}
.task-card .tc-no{font-family:Consolas,monospace;font-size:13px;font-weight:700}
.task-card .tc-meta{font-size:12px;color:var(--txt2);line-height:1.7}
.bigprog{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;margin:8px 0 4px}
.bigprog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--info))}
.curprod{background:linear-gradient(145deg,rgba(47,123,255,.18),rgba(47,123,255,.05));border:1.5px solid var(--pri);border-radius:16px;padding:16px;text-align:center;margin:12px 0}
.curprod .loc{font-size:30px;font-weight:800;color:var(--pri);letter-spacing:1px}
.curprod .gname{font-size:16px;font-weight:700;margin:8px 0 4px}
.curprod .qty{font-size:40px;font-weight:900;line-height:1}
.curprod .qty small{font-size:14px;color:var(--txt2);font-weight:600}
.view-sw{position:absolute;top:9px;right:12px;font-size:11px;color:var(--pri);background:rgba(47,123,255,.15);padding:4px 10px;border-radius:999px;cursor:pointer;z-index:5}
.listrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.listrow .lk{font-family:Consolas,monospace;color:var(--info);font-size:12px}
.cage{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.cage .cell{border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:var(--card)}
.cage .cell.on{border-color:var(--pri);background:rgba(47,123,255,.15)}
.cage .slot{font-size:22px}.cage .store{font-size:11px;color:var(--txt2);margin:3px 0}.cage .need{font-size:12px;font-weight:700}
.twobtn{display:flex;gap:8px}.twobtn .btn{flex:1}
.headrel{position:relative}
</style>
</head>
<body>
<div class="desc">
  <h1>📦 WMS V1.5 · PDA 作业终端（统一入口 · 全作业链路）</h1>
  <p>深色大字体仓库作业风格。底部 Tab：<b>首页(九宫格)</b> / <b>任务</b> / <b>扫码</b> / <b>消息</b> / <b>我的</b>。首页为统一作业入口，覆盖入库、出库、库内、盘点、退货、改派签收全流程。点击任一功能图标进入真实作业交互；屏幕内按钮均可点。</p>
</div>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>10:25</span><span class="right">📶 5G <b>86%</b> 🔋</span></div>
  <div id="appbar" class="appbar" style="display:none"></div>
  <div id="screen" class="screen"></div>
  <div class="tabbar">
    <div class="tab on" data-tab="home" onclick="go('home')"><div class="ic">🏠</div>首页</div>
    <div class="tab" data-tab="tasks" onclick="go('tasks')"><div class="ic">📋</div>任务</div>
    <div class="tab scan" data-tab="scan" onclick="go('scan')"><div class="ic">📷</div></div>
    <div class="tab" data-tab="msg" onclick="go('msg')"><div class="ic">🔔</div>消息</div>
    <div class="tab" data-tab="me" onclick="go('me')"><div class="ic">👤</div>我的</div>
  </div>
</div>

<script>
var stack=[];
function $(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function toast(m,t){
  var el=document.createElement('div');
  el.style.cssText='position:absolute;left:50%;top:72%;transform:translateX(-50%);background:rgba(20,28,46,.96);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;z-index:99;border:1px solid #2d3a55;max-width:300px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)';
  var col={ok:'#22c55e',bad:'#ef4444',warn:'#f59e0b',info:'#38bdf8'}[t||'info'];
  el.innerHTML=(col?'<span style="color:'+col+'">●</span> ':'')+m;
  document.querySelector('.phone').appendChild(el);
  setTimeout(function(){el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(function(){el.remove();},300);},1800);
}
function setBar(title,back,act){
  var bar=document.getElementById('appbar');
  if(title){bar.style.display='flex';
    bar.innerHTML='<div class="back" onclick="'+(back||'go(\'home\')')+'">‹</div><h2>'+title+'</h2>'+(act||'');
  } else bar.style.display='none';
  document.getElementById('screen').scrollTop=0;
}
function setTab(t){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.tab===t);});}
function go(name,arg){
  stack.push(name);
  render(name,arg);
}
function back(){stack.pop();var cur=stack.pop()||'home';render(cur);}
function render(name,arg){
  var s=document.getElementById('screen');s.innerHTML='';
  setTab(name==='home'?'home':name==='tasks'?'tasks':name==='scan'?'scan':name==='msg'?'msg':name==='me'?'me':'');
  if(SCREENS[name]){SCREENS[name](s,arg);}
  else {setBar(null);s.innerHTML='<div class="muted" style="text-align:center;padding:60px 0">建设中…</div>';}
}

var GROUPS=[
  {t:'入库作业',items:[
    {ic:'🚚',nm:'到货收货',go:'receive',bd:3},
    {ic:'📥',nm:'验货上架',go:'putaway',bd:5},
    {ic:'↩️',nm:'销售退货',go:'returnIn'},
  ]},
  {t:'出库作业',items:[
    {ic:'🌊',nm:'拣货/分拣',go:'pick',bd:2},
    {ic:'🔁',nm:'补货',go:'replenish',bd:1},
    {ic:'✅',nm:'复核打包',go:'check',bd:1},
    {ic:'🚛',nm:'装车发运',go:'load'},
  ]},
  {t:'库内作业',items:[
    {ic:'↔️',nm:'移库移位',go:'move'},
    {ic:'🔒',nm:'冻结/解冻',go:'freeze'},
    {ic:'📝',nm:'库存调整',go:'adjust'},
    {ic:'🗑️',nm:'报损报废',go:'loss'},
    {ic:'🧩',nm:'组装拆卸',go:'assembly'},
    {ic:'⏳',nm:'效期查询',go:'expiry'},
  ]},
  {t:'盘点 / 退货',items:[
    {ic:'⚡',nm:'动盘',go:'countMove'},
    {ic:'📊',nm:'全盘/指定盘',go:'countFull'},
    {ic:'📤',nm:'采购退货',go:'returnOut'},
    {ic:'🔄',nm:'改派签收',go:'reschedule',bd:1},
  ]},
  {t:'查询 / 异常',items:[
    {ic:'🔍',nm:'库存查询',go:'stock'},
    {ic:'🚨',nm:'异常上报',go:'exception',bd:2},
    {ic:'🗺️',nm:'库位查看',go:'binview'},
  ]},
];

var SCREENS={};
SCREENS.home=function(s){
  setBar(null);
  s.innerHTML=`
  <div class="hello"><div class="who">赵拣货 <small>白班 · B区拣货组</small></div><div class="sub">杭州总仓 · 今日待办 12 项，2 项加急 🔴</div></div>
  <div class="search">🔍 <span>搜索功能 / 扫单号跳转（支持 波次/库位/商品/箱码）</span></div>
  <div class="quick">
    <h3>⚡ 待办作业（优先级）</h3>
    <div class="taskrow" onclick="go('pick')"><div class="ti" style="background:rgba(239,68,68,.18)">🔴</div><div class="tm"><div class="t1">加急拣货 W20260823-03</div><div class="t2">B-03区 · 8行38件 · 缺货待加急补货</div></div><div class="go">去拣货 ›</div></div>
    <div class="taskrow" onclick="go('check')"><div class="ti" style="background:rgba(245,158,11,.18)">🟡</div><div class="tm"><div class="t1">复核差异 W20260823-01</div><div class="t2">少发2箱待处理 · 赵复核</div></div><div class="go">去处理 ›</div></div>
    <div class="taskrow" onclick="go('putaway')"><div class="ti" style="background:rgba(47,123,255,.18)">🔵</div><div class="tm"><div class="t1">上架任务 PA...012（5项）</div><div class="t2">收货口 R-01 待上架</div></div><div class="go">去上架 ›</div></div>
  </div>`;
  GROUPS.forEach(function(g){
    var d=document.createElement('div');
    var items=g.items.map(function(it){
      return `<div class="gi" onclick="go('${it.go}')">${it.bd?`<span class="badge">${it.bd}</span>`:''}<span class="ic">${it.ic}</span><span class="nm">${it.nm}</span></div>`;
    }).join('');
    d.innerHTML=`<div class="sect-t">${g.t} <b>(${g.items.length})</b></div><div class="grid">${items}</div>`;
    s.appendChild(d);
  });
};

SCREENS.tasks=function(s){
  setBar('我的任务',null);
  var tabs=['全部','待处理','进行中','加急','已完成'];
  s.innerHTML='<div class="hometabs">'+tabs.map(function(t,i){return '<div class="ht'+(i===1?' on':'')+'">'+t+'</div>';}).join('')+'</div>';
  var list=[
    {ic:'🌊',c:'rgba(239,68,68,.18)',t:'加急拣货 W...03',d:'B-03 · 8行38件 · 缺货',st:'待处理',cls:'t-bad',go:'pick'},

var PDA_PICK_TASKS=[

  {no:'SI...C02',wave:'W...04',zone:'C区',zoneColor:'#7c3aed',mode:'汇总拣+分播',orders:3,pcs:16,picked:0,help:true,
    items:[{loc:'C-01-03',g:'乐事薯片 原味 70g',batch:'20260725',qty:16,picked:0}],
    sort:[{slot:'格口1',store:'物美(海淀黄庄)',qty:6},{slot:'格口2',store:'超市发(双榆树)',qty:6},{slot:'格口3',store:'盒马(西直门)',qty:4}],urgent:false}
];
var PDA_CLICK_PICK=true;  // WMS_PDA_CLICK_PICK：false=仅扫码
function pdaPickBar(extraAct){
  return '<span class="view-sw" onclick="pdaToggleView()">逐件聚焦 ⇄ 清单</span>'+(extraAct||'');
}
SCREENS.pick=function(s){
  setBar('拣货/分拣',"go('home')");
  var myZone='B区';
  var mine=PDA_PICK_TASKS.filter(function(t){return !t.help;});
  var help=PDA_PICK_TASKS.filter(function(t){return t.help;});
  function card(t,isHelp){
    var done=t.items.reduce(function(a,it){return a+it.picked;},0);
    var pct=Math.round(done/t.pcs*100);
    return '<div class="task-card'+(isHelp?' help':'')+'" onclick="pdaGrab(\''+t.no+'\','+(isHelp?'true':'false')+')">'+
      '<div class="tc-top"><span class="zn" style="background:'+t.zoneColor+'">'+t.zone+'</span>'+
      '<span class="tc-no">'+t.no+'</span>'+(t.urgent?'<span class="tag t-bad">加急</span>':'')+(isHelp?'<span class="tag t-ok">可支援</span>':'')+'</div>'+
      '<div class="tc-meta">🌊 '+t.wave+' · '+t.mode+'<br>📦 '+t.orders+'单 · 应拣 <b>'+t.pcs+'</b> 件'+(isHelp?'<br><span style="color:var(--ok)">🤝 完成本区后可抢单支援（自由领取+主管指定）</span>':'')+'</div>'+
      (pct>0?'<div class="bigprog"><i style="width:'+pct+'%"></i></div><div class="muted" style="font-size:11px">已拣 '+done+'/'+t.pcs+'</div>':'')+
      '<button class="btn pri" style="margin-top:10px">'+(pct>0?'继续拣货':(isHelp?'🤝 跨区支援抢单':'🎯 按顺序抢单'))+'</button></div>';
  }
  s.innerHTML=
    '<div class="hometabs"><div class="ht on" onclick="pdaPickTab(this,\'mine\')">🅰️ 我的库区（'+myZone+'）</div><div class="ht" onclick="pdaPickTab(this,\'help\')">🤝 可支援库区</div></div>'+
    '<div id="pickMine">'+(mine.length?mine.map(function(t){return card(t,false);}).join(''):'<div class="alert ok">本区任务已完成，去「可支援库区」帮忙吧 👍</div>')+'</div>'+
    '<div id="pickHelp" style="display:none">'+(help.length?help.map(function(t){return card(t,true);}).join(''):'<div class="alert info">暂无可支援库区任务</div>')+'</div>'+
    '<div class="note">任务按库区生成，只显示你管理库区的商品；可支援库区由参数 WMS_CROSS_ZONE_SCOPE 配置。下方「扫码设置」可切换 仅扫码/扫码+点击。</div>'+
    '<button class="btn ghost" onclick="pdaToggleClick()">'+(PDA_CLICK_PICK?'✅ 当前：扫码+点击商品可操作（点此切为仅扫码）':'🔒 当前：仅扫码可操作（点此开启点击）')+'</button>';
};
function pdaPickTab(el,tab){
  document.querySelectorAll('.hometabs .ht').forEach(function(x){x.classList.remove('on');});
  el.classList.add('on');
  document.getElementById('pickMine').style.display=tab==='mine'?'':'none';
  document.getElementById('pickHelp').style.display=tab==='help'?'':'none';
}
function pdaToggleClick(){PDA_CLICK_PICK=!PDA_CLICK_PICK;SCREENS.pick(document.getElementById('screen'));toast(PDA_CLICK_PICK?'已开启扫码+点击':'已切为仅扫码');}
function pdaGrab(no,isHelp){
  var t=PDA_PICK_TASKS.filter(function(x){return x.no===no;})[0];if(!t)return;
  window.pdaPick={task:t,view:'focus',idx:t.items.findIndex(function(it){return it.picked<it.qty;})};
  if(window.pdaPick.idx<0)window.pdaPick.idx=0;
  if(isHelp)toast('已跨区支援抢单（'+t.zone+'）','ok');else toast('已抢单，开始拣货','ok');
  pdaRenderTask();
}
function pdaToggleView(){if(!window.pdaPick)return;window.pdaPick.view=window.pdaPick.view==='focus'?'list':'focus';pdaRenderTask();}
function pdaRenderTask(){
  var s=document.getElementById('screen'),P=window.pdaPick;if(!P)return;
  var t=P.task;
  setBar(t.zone+' · '+t.no,pdaBackList,pdaPickBar());
  var done=t.items.reduce(function(a,it){return a+it.picked;},0);
  var pct=Math.round(done/t.pcs*100);
  var allDone=done>=t.pcs;
  var head='<div class="card headrel"><h4>🛒 '+t.wave+' · '+t.mode+(t.urgent?' 🔴':'')+'</h4>'+
    '<div class="kv"><span class="k">订单/件数</span><span class="v">'+t.orders+'单 · '+done+'/'+t.pcs+'件</span></div>'+
    '<div class="bigprog"><i style="width:'+pct+'%"></i></div></div>';

  var body='';
  if(allDone){
    body='<div class="curprod"><div style="font-size:48px">🎉</div><div class="gname">本任务已全部拣齐</div>'+
      (t.sort?'<div class="muted" style="margin-top:6px">下一步：到分拣墙按格口分播</div>':'<div class="muted" style="margin-top:6px">等待齐套复检</div>')+'</div>';
    if(t.sort){
      body+='<button class="btn pri" onclick="pdaRenderSort()">🎯 前往分播（分拣墙）</button>';
    }else{
      body+='<button class="btn ok" onclick="toast(\'拣货完成，等待按订单集齐复检\',\'ok\');setTimeout(function(){go(\'pick\');},700)">✔ 完成拣货</button>';
    }
  }else if(P.view==='list'){
    body='<div class="card"><h4>📋 清单总览（全部行）</h4>'+
      t.items.map(function(it,i){
        var d=it.picked>=it.qty, cur=(i===P.idx);
        var clickable=PDA_CLICK_PICK?('onclick="pdaPickIdx('+i+')"'):'';
        return '<div class="list-row" style="'+(cur?'background:rgba(47,123,255,.12);border-radius:8px;padding:9px 8px;':'')+'" '+clickable+'>'+
          '<span class="lk">'+it.loc+'</span><div style="flex:1"><div style="font-weight:600">'+it.g+'</div><div class="muted" style="font-size:11px">批次 '+it.batch+' · 应拣 '+it.qty+'</div></div>'+
          (d?'<span class="tag t-ok">✓'+it.picked+'</span>':'<b style="color:var(--pri)">'+it.picked+'/'+it.qty+'</b>')+'</div>';
      }).join('')+'</div>';
    if(!PDA_CLICK_PICK)body+='<div class="alert tip">🔒 当前仅扫码模式：请用扫码枪扫商品/库位码确认；如需点击，回任务列表开启"扫码+点击"。</div>';
    body+='<div class="scan" onclick="pdaScanItem()"><span class="ic">📷</span><div class="b">扫商品/库位码确认</div><div class="s">大扫码区，扫中即完成当前行并自动下一条</div></div>';
  }else{
    var it=t.items[P.idx];
    body='<div class="scan" onclick="pdaScanItem()"><span class="ic">📷</span><div class="b">扫商品 / 库位码</div><div class="s">大扫码区 · 扫码自动确认并进入下一商品</div></div>'+
      '<div class="curprod"><div class="loc">📍 '+it.loc+'</div><div class="gname">'+it.g+'</div>'+
      '<div class="muted" style="margin-bottom:8px">批次 '+it.batch+'（FEFO 先到期先出）</div>'+
      '<div class="qty">'+(it.picked+1)+'<small>/'+it.qty+' 件</small></div></div>';
    if(PDA_CLICK_PICK){
      body+='<button class="btn pri" onclick="pdaScanItem()">✔ 点击确认本件（可点模式）</button>';
    }else{
      body+='<div class="alert tip">🔒 仅扫码模式：请扫码确认，不支持点击</div>';
    }
  }
  // 底部两大按钮
  var foot='<div class="twobtn"><button class="btn bad" onclick="go(\'replenish\',\'urgent\')">⚡ 缺货加急</button><button class="btn warn" onclick="toast(\'已挂起并升级主管\',\'warn\')">🚨 异常</button></div>';

    var nx=t.items.findIndex(function(x,i){return i>P.idx&&x.picked<x.qty;});

    toast(it.g+' 已拣齐 ✓','ok');

var PDA_CHECK_VIEW='focus';
SCREENS.check=function(s){
  setBar('复核打包',"go('home')",'<span class="view-sw" onclick="pdaCheckToggle()">逐件 ⇄ 清单</span>');
  var items=[
    {g:'农夫山泉 550ml×24',batch:'20260801',qty:10,scanned:10},
    {g:'可口可乐 330ml×24',batch:'20260720',qty:5,scanned:5},
    {g:'康师傅红烧牛肉面 105g',batch:'20260601',qty:8,scanned:6},
    {g:'海天酱油 500ml',batch:'20260510',qty:9,scanned:0},
    {g:'双汇火腿肠',batch:'20260810',qty:6,scanned:0}
  ];
  var cur=items.find(function(it){return it.scanned<it.qty;});
  var scanned=items.reduce(function(a,it){return a+Math.min(it.scanned,it.qty);},0);
  var total=items.reduce(function(a,it){return a+it.qty;},0);
  var pct=Math.round(scanned/total*100);
  var head='<div class="card headrel"><h4>📋 W...01 / SO...0218</h4>'+
    '<div class="kv"><span class="k">客户</span><span class="v">华联(亦庄店)</span></div>'+
    '<div class="kv"><span class="k">已扫 / 应发</span><span class="v">'+scanned+' / '+total+' 件</span></div>'+
    '<div class="bigprog"><i style="width:'+pct+'%"></i></div></div>';
  var body='';
  if(PDA_CHECK_VIEW==='list'){
    body='<div class="card"><h4>清单（逐件复检）</h4>'+items.map(function(it){
      var ok=it.scanned>=it.qty, short=it.scanned>0&&it.scanned<it.qty;
      return '<div class="list-row"><div style="flex:1"><b>'+it.g+'</b><div class="muted" style="font-size:11px">批次 '+it.batch+' · 应发 '+it.qty+'</div></div>'+(ok?'<span class="tag t-ok">✓'+it.scanned+'</span>':(short?'<span class="tag t-bad">少'+(it.qty-it.scanned)+'</span>':'<span class="tag t-gray">待扫</span>'))+'</div>';
    }).join('')+'</div>';
  }
  body+='<div class="scan" onclick="pdaCheckScan()"><span class="ic">📷</span><div class="b">扫商品 / 箱码复检</div><div class="s">拆零逐件 · 扫中即核对当前商品</div></div>';
  if(cur){
    body+='<div class="curprod"><div class="loc">🔍 当前待扫</div><div class="gname">'+cur.g+'</div><div class="muted" style="margin-bottom:8px">批次 '+cur.batch+'（FEFO）</div><div class="qty">'+cur.scanned+'<small>/'+cur.qty+' 件</small></div></div>';
  }else{
    body+='<div class="curprod"><div style="font-size:48px">✅</div><div class="gname">全部扫齐</div></div>';
  }
  var diff=(cur&&cur.scanned>0&&cur.scanned<cur.qty);
  if(diff){
    body+='<div class="alert bad">❗ '+cur.g+' 少发，请处理差异（扣账前纠正）</div>';
  }
  body+='<div class="twobtn"><button class="btn warn" onclick="toast(\'已通知补拣/登记破损\',\'warn\')">📤 补拣/破损</button><button class="btn bad" onclick="go(\'exception\')">🚨 异常</button></div>';
  if(!diff&&scanned>=total){
    body+='<button class="btn ok" style="margin-top:10px" onclick="checkPass()">✔ 复检通过并扣库存</button>';
  }else{
    body+='<button class="btn ghost" style="margin-top:10px" onclick="toast(\'按差异放行需 WMS_CHECK_SHORT_ALLOWED 且留痕\',\'warn\')">按差异放行(留痕)</button>';
  }
  s.innerHTML=head+body;
};
