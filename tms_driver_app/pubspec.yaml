name: tms_driver_app
description: TMS 司机配送系统 - 司机端 APP（V1.3 离线能力）
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  geolocator: ^13.0.0
  # P6 离线能力
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  url_launcher: ^6.3.2
  # 消息推送：个推离线通道 + 本地通知栏展示
  # getuiflut 由个推官方发布，负责厂商通道与 CID 下发；
  # 个推透传消息不会自动弹通知栏，需由本地通知插件承接展示。
  getuiflut: ^0.2.41
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
